<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Shop ♡</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#fff7fb;
  color:#665761;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   MENU เดิม
========================= */

.menu-button{
  width:45px;
  height:45px;
  border:none;
  border-radius:15px;
  background:#fff0f6;
  color:#dc82a8;
  font-size:22px;
}

.menu-button:hover{
  background:#ffdcea;
}

.side-menu{
  position:fixed;
  top:0;
  right:-330px;
  width:310px;
  height:100vh;
  background:white;
  z-index:200;
  padding:25px;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  transition:.3s;
}

.side-menu.open{
  right:0;
}

.menu-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px;
}

.close-menu{
  border:none;
  background:#fff0f6;
  color:#d883a5;
  width:35px;
  height:35px;
  border-radius:12px;
}

.menu-item{
  width:100%;
  border:none;
  background:#fff7fa;
  color:#806b74;
  padding:15px;
  margin-bottom:10px;
  border-radius:15px;
  text-align:left;
  font-size:14px;
}

.menu-item:hover{
  background:#ffe4ef;
}


/* =========================
   HOME / PROFILE
========================= */

.page{
  min-height:100vh;
}

.home-page{
  padding-bottom:105px;
}

.profile-banner{
  height:220px;
  position:relative;
  overflow:hidden;
  background:#ffddea;
  background-size:cover;
  background-position:center;
}

.profile-banner::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.03),
    rgba(0,0,0,.12)
  );
}

.profile-nav{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  z-index:2;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:0 14px;
}

.profile-label{
  color:white;
  font-weight:bold;
  text-shadow:0 1px 5px rgba(0,0,0,.25);
}

.profile-nav .menu-button{
  justify-self:end;
  background:rgba(255,255,255,.88);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 18px;
  margin-top:-40px;
  position:relative;
  z-index:3;
}

.profile-avatar{
  width:88px;
  height:88px;
  border-radius:50%;
  object-fit:cover;
  background:#ffe5ef;
  border:4px solid white;
  box-shadow:0 3px 15px rgba(80,40,60,.14);
}

.profile-name{
  font-size:20px;
  font-weight:bold;
  color:#6f5a64;
  overflow-wrap:anywhere;
  padding-top:28px;
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px 18px 16px;
}

.profile-action{
  border:1px solid #ead7df;
  background:white;
  border-radius:13px;
  padding:11px;
  color:#806b74;
  font-weight:bold;
}

.profile-action:hover{
  background:#fff0f6;
}

.profile-divider{
  border-top:1px solid #eadbe2;
}

.home-product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  background:#fff;
}

.home-grid-item{
  aspect-ratio:1/1;
  border:0;
  padding:0;
  overflow:hidden;
  background:#fff0f6;
  position:relative;
}

.home-grid-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* =========================
   PRODUCT PAGE
========================= */

.container{
  padding:0 18px 100px;
}

.products-page{
  padding-top:20px;
}

.page-top{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.back-button{
  border:0;
  background:#fff0f6;
  color:#d77fa3;
  padding:10px 14px;
  border-radius:13px;
}

.page-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3;
}

.search{
  width:100%;
  border:0;
  outline:0;
  background:#fff;
  padding:16px 20px;
  border-radius:18px;
  box-shadow:0 3px 15px rgba(255,150,190,.08);
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 0;
}

.category{
  border:1px solid #f3d4e1;
  background:#fff;
  color:#9b7d8a;
  border-radius:20px;
  padding:9px 15px;
  white-space:nowrap;
}

.category.active{
  background:#f6a4c5;
  color:#fff;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:15px;
}

.product{
  background:#fff;
  padding:10px;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(255,150,190,.09);
  overflow:hidden;
}

.product-image-wrap{
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  border-radius:15px;
  background:#fff0f6;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.product-name{
  font-size:14px;
  font-weight:bold;
  margin:10px 4px 3px;
}

.product-category{
  font-size:11px;
  color:#b6a3ab;
  margin:0 4px;
}

.product-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
}

.price{
  color:#df7ca4;
  font-weight:bold;
}

.add{
  border:0;
  background:#f5a0c2;
  color:white;
  border-radius:12px;
  padding:8px 12px;
}


/* =========================
   CART
========================= */

.cart-panel{
  position:fixed;
  right:0;
  top:0;
  width:380px;
  height:100vh;
  background:white;
  z-index:150;
  padding:22px;
  transform:translateX(100%);
  transition:.3s;
  box-shadow:-5px 0 25px rgba(80,40,60,.12);
  display:flex;
  flex-direction:column;
}

.cart-panel.open{
  transform:translateX(0);
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:bold;
}

.cart-close{
  border:0;
  background:#fff0f6;
  color:#d681a5;
  width:35px;
  height:35px;
  border-radius:12px;
}

.cart-list{
  flex:1;
  overflow-y:auto;
  margin-top:15px;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed #eadbe2;
}

.cart-image{
  width:55px;
  height:55px;
  border-radius:12px;
  object-fit:cover;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-size:13px;
  font-weight:bold;
}

.cart-price{
  color:#df7ca4;
  font-size:12px;
  margin-top:4px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:6px;
}

.quantity button{
  width:24px;
  height:24px;
  border:0;
  border-radius:8px;
  background:#ffe5ef;
  color:#d97c9f;
}

.delete-item{
  border:0;
  background:none;
  color:#bca7b0;
}

.summary{
  border-top:1px dashed #e2d2da;
  padding-top:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:8px 0;
  font-size:13px;
}

.total{
  color:#df77a2;
  font-size:19px;
  font-weight:bold;
}

.checkout,
.modal-button{
  width:100%;
  border:0;
  padding:14px;
  border-radius:17px;
  margin-top:12px;
  background:#f49bc0;
  color:#fff;
  font-weight:bold;
}


/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(70,40,55,.28);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:25px;
  padding:25px;
}

.modal-title{
  font-size:21px;
  font-weight:bold;
  color:#d77fa3;
  margin-bottom:18px;
}

.input{
  width:100%;
  padding:13px;
  border:1px solid #f0dce5;
  outline:0;
  border-radius:13px;
  margin:5px 0 10px;
}

.cancel-button{
  background:#fff0f5;
  color:#bd8fa2;
}


/* =========================
   DM
========================= */

.dm-link{
  display:block;
  text-decoration:none;
  text-align:center;
  background:#fff7fa;
  border:1px solid #f0dce5;
  color:#806b74;
  padding:14px;
  border-radius:14px;
  margin:10px 0;
  font-weight:bold;
}

.dm-link:hover{
  background:#ffe4ef;
}


/* =========================
   PRODUCT DETAIL
========================= */

.product-detail-modal{
  position:relative;
  background:#fff;
  border-radius:22px;
  padding:20px;
  max-width:520px;
  width:calc(100vw - 30px);
  max-height:90vh;
  overflow:auto;
}

.modal-close{
  position:absolute;
  right:12px;
  top:10px;
  border:0;
  background:transparent;
  font-size:24px;
  cursor:pointer;
  z-index:3;
}

.detail-image-box{
  width:100%;
  aspect-ratio:1/1;
  border-radius:16px;
  overflow:hidden;
  background:#f6f6f6;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
}

.detail-image-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.detail-category{
  font-size:13px;
  color:#d77fa3;
  margin-bottom:4px;
}

.detail-name{
  margin:0 0 10px;
  font-size:22px;
}

.detail-description{
  font-size:15px;
  line-height:1.7;
  white-space:normal;
  color:#555;
  word-break:break-word;
  margin-bottom:18px;
}

.detail-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail-actions button{
  min-height:46px;
  border-radius:12px;
  border:0;
  font-size:15px;
}

.primary-btn{
  background:#d77fa3;
  color:#fff;
}

.secondary-btn{
  background:#f1f1f1;
  color:#333;
}


/* =========================
   PAYMENT
========================= */

.copy-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin:8px 0 14px;
}

.copy-value{
  flex:1;
  background:#fff7fa;
  border:1px solid #f0dce5;
  padding:12px;
  border-radius:12px;
  word-break:break-all;
}

.copy-btn{
  border:0;
  background:#ffe4ef;
  color:#c97e9d;
  padding:11px 12px;
  border-radius:12px;
}

.payment-card{
  background:#fffafd;
  border:1px solid #f0dce5;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.qr{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:15px;
  background:#fff0f6;
}

.slip-preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:15px;
  margin-top:10px;
  background:#fff7fa;
}

.confirm-disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================
   ADMIN
========================= */

.admin-section{
  border-top:1px dashed #ead9e1;
  margin-top:18px;
  padding-top:15px;
}

.admin-row{
  display:flex;
  gap:7px;
  align-items:center;
  margin-bottom:8px;
}

.admin-row input{
  flex:1;
  padding:10px;
  border:1px solid #f0dce5;
  border-radius:12px;
  outline:0;
}

.admin-row button{
  border:0;
  padding:10px 12px;
  border-radius:11px;
  background:#ffe4ef;
  color:#c97e9d;
}


/* =========================
   RECEIPT
========================= */

.receipt{
  background:#fffafd;
  border:1px dashed #e4bdce;
  border-radius:15px;
  padding:18px;
}

.receipt-center{
  text-align:center;
}

.receipt-line{
  border-top:1px dashed #decbd3;
  margin:12px 0;
}


/* =========================
   BOTTOM BAR
========================= */

.bottom-bar{
  position:fixed;
  left:50%;
  bottom:15px;
  transform:translateX(-50%);
  width:min(92%,600px);
  min-height:62px;
  background:rgba(255,255,255,.96);
  border-radius:22px;
  box-shadow:0 6px 25px rgba(100,50,70,.15);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:8px;
  z-index:90;
}

.bottom-bar button{
  border:0;
  background:transparent;
  color:#a17f8d;
  border-radius:15px;
  padding:9px 13px;
  font-size:12px;
}

.bottom-bar button.active,
.bottom-bar button:hover{
  background:#ffe5ef;
  color:#d8789f;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .cart-panel{
    width:100%;
  }

  .side-menu{
    width:85%;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .profile-banner{
    height:190px;
  }

}
</style>
</head>


<body>

<!-- =========================
     SIDE MENU
========================= -->

<div id="sideMenu" class="side-menu">

  <div class="menu-title">
    <span>เมนู</span>

    <button
      class="close-menu"
      onclick="closeMenu()"
    >×</button>
  </div>

  <button
    class="menu-item"
    onclick="showCategories()"
  >
    ♡ หมวดหมู่สินค้า
  </button>

  <button
    class="menu-item"
    onclick="contactAdmin()"
  >
    ♡ ติดต่อแอดมิน
  </button>

  <button
    class="menu-item"
    onclick="adminLogin()"
  >
    ⚙ ตั้งค่าเว็บ
  </button>

</div>


<!-- =========================
     HOME
========================= -->

<section
  id="homePage"
  class="page home-page"
>

  <div
    id="profileBanner"
    class="profile-banner"
  >

    <div class="profile-nav">

      <span></span>

      <span class="profile-label">
        โปรไฟล์
      </span>

      <!-- เมนูเดิม -->
      <button
        class="menu-button"
        onclick="openMenu()"
      >
        ☰
      </button>

    </div>

  </div>


  <div class="profile-head">

    <img
      id="profileAvatar"
      class="profile-avatar"
      src=""
      alt="profile"
    >

    <div
      id="profileName"
      class="profile-name"
    >
      ♡ My Cute Shop ♡
    </div>

  </div>


  <div class="profile-actions">

    <button
      class="profile-action"
      onclick="contactAdmin()"
    >
      DM
    </button>

    <button
      class="profile-action"
      onclick="openProducts()"
    >
      Menu
    </button>

  </div>


  <div class="profile-divider"></div>


  <div
    style="
      padding:14px 18px 8px;
      font-weight:bold;
      color:#d77fa3
    "
  >
    สินค้า
  </div>


  <div
    id="homeProductGrid"
    class="home-product-grid"
  ></div>

</section>



<!-- =========================
     PRODUCTS PAGE
========================= -->

<section
  id="productsPage"
  class="page products-page"
  style="display:none"
>

  <div class="container">

    <div class="page-top">

      <button
        class="back-button"
        onclick="showHome()"
      >
        ← หน้าร้าน
      </button>

      <div class="page-title">
        สินค้า
      </div>

    </div>


    <input
      id="search"
      class="search"
      placeholder="ค้นหาสินค้า..."
    >


    <div
      id="categories"
      class="categories"
    ></div>


    <div
      id="products"
      class="products"
    ></div>

  </div>

</section>



<!-- =========================
     CART
========================= -->

<div
  id="cartPanel"
  class="cart-panel"
>

  <div class="cart-header">

    <span>
      🛒 สรุปออเดอร์
    </span>

    <button
      class="cart-close"
      onclick="closeCart()"
    >
      ×
    </button>

  </div>


  <div
    id="cartList"
    class="cart-list"
  ></div>


  <div class="summary">

    <div class="summary-row">
      <span>รายการสินค้า</span>
      <span id="summaryCount">0</span>
    </div>

    <div class="summary-row">
      <span>ยอดสินค้า</span>
      <span id="subtotal">0 ฿</span>
    </div>

    <div class="summary-row total">
      <span>รวมทั้งหมด</span>
      <span id="total">0 ฿</span>
    </div>


    <button
      class="checkout"
      onclick="openCheckout()"
    >
      ชำระเงิน
    </button>

  </div>

</div>



<!-- =========================
     BOTTOM BAR
========================= -->

<div
  id="bottomBar"
  class="bottom-bar"
>

  <button
    id="homeNav"
    class="active"
    onclick="showHome()"
  >
    🏠<br>
    หน้าร้าน
  </button>


  <button
    id="productNav"
    onclick="openProducts()"
  >
    ♡<br>
    สินค้า
  </button>


  <button
    onclick="openCart()"
  >
    🛒<br>
    ตะกร้า
  </button>


  <button
    onclick="contactAdmin()"
  >
    💌<br>
    ติดต่อ
  </button>

</div>



<!-- =========================
     MODAL
========================= -->

<div
  id="modal"
  class="modal"
>

  <div
    id="modalContent"
    class="modal-box"
  ></div>

</div>



<script>

/* =====================================================
   DEFAULT DATA
===================================================== */

const defaults = {

  name:"♡ My Cute Shop ♡",

  description:"♡ Thank you for support ♡",

  logo:
    "https://via.placeholder.com/100/ffe1ed/ffffff?text=♡",

  banner:
    "https://via.placeholder.com/1200x400/ffddea/d77fa3?text=Banner",

  categories:[
    "ทั้งหมด",
    "ของแต่ง",
    "สติ๊กเกอร์",
    "ของสะสม",
    "สินค้าใหม่"
  ],

  facebook:
    "https://www.facebook.com/",

  line:
    "https://line.me/",

  paymentName:
    "Akines",

  bankName:
    "k p",

  bankNumber:
    "000-0-0000000",

  walletName:
    "Wallet",

  walletNumber:
    "000-000-0000",

  paymentNote:
    "ข้อความ",

  qr:
    "https://via.placeholder.com/600/fff0f6/d77fa3?text=QR"

};


/* =====================================================
   LOAD DATA
===================================================== */

let shop = {
  ...defaults,
  ...(JSON.parse(
    localStorage.getItem("shopData")
  ) || {})
};


let products =
  JSON.parse(
    localStorage.getItem("products")
  ) || [

    {
      id:1,
      name:"แฮร์บัวใส่กล่อง",
      price:199,
      category:"ของแต่ง",
      image:
        "https://via.placeholder.com/500/ffe4ef/ffffff?text=Product",
      description:
        "รายละเอียดสินค้า",
      exampleLink:""
    },

    {
      id:2,
      name:"สติ๊กเกอร์หัวใจ",
      price:59,
      category:"สติ๊กเกอร์",
      image:
        "https://via.placeholder.com/500/ffeaf2/ffffff?text=Sticker",
      description:
        "รายละเอียดสินค้า",
      exampleLink:""
    }

  ];


let cart =
  JSON.parse(
    localStorage.getItem("cartData")
  ) || [];


let currentCategory = "ทั้งหมด";

let selectedSlip = "";


/* =====================================================
   SAVE
===================================================== */

function saveAll(){

  localStorage.setItem(
    "shopData",
    JSON.stringify(shop)
  );

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "cartData",
    JSON.stringify(cart)
  );

}


/* =====================================================
   SHOP
===================================================== */

function renderShop(){

  document.getElementById(
    "profileName"
  ).textContent = shop.name;


  document.getElementById(
    "profileAvatar"
  ).src = shop.logo;


  document.getElementById(
    "profileBanner"
  ).style.backgroundImage =
    `url("${shop.banner}")`;

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

  document.getElementById(
    "homePage"
  ).style.display = "block";


  document.getElementById(
    "productsPage"
  ).style.display = "none";


  document.getElementById(

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m])
  );

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );


/* =====================================================
   CART
===================================================== */

function addToCart(id){

  const p =
    products.find(
      x=>x.id===id
    );

  if(!p) return;


  const e =
    cart.find(
      x=>x.id===id
    );


  if(e){

    e.quantity++;

  }else{

    cart.push({
      ...p,
      quantity:1
    });

  }


  saveAll();

  renderCart();

}


function changeQuantity(id,n){

  const e =
    cart.find(
      x=>x.id===id
    );

  if(!e) return;


  e.quantity += n;


  if(e.quantity<=0){

    cart =
      cart.filter(
        x=>x.id!==id
      );

  }


  saveAll();

  renderCart();

}


function deleteCartItem(id){

  cart =
    cart.filter(
      x=>x.id!==id
    );


  saveAll();

  renderCart();

}


function renderCart(){

  const box =
    document.getElementById(
      "cartList"
    );

  box.innerHTML = "";


  let count = 0;

  let total = 0;


  cart.forEach(i=>{

    count += i.quantity;

    total +=
      Number(i.price) *
      i.quantity;


    box.innerHTML += `

      <div class="cart-item">

        <img
          class="cart-image"
          src="${escapeHtml(i.image)}"
        >


        <div class="cart-info">

          <div class="cart-name">
            ${escapeHtml(i.name)}
          </div>


          <div class="cart-price">
            ${Number(i.price).toLocaleString()} ฿ / ชิ้น
          </div>


          <div class="quantity">

            <button
              onclick="changeQuantity(${i.id},-1)"
            >
              −
            </button>


            <span>
              ${i.quantity}
            </span>


            <button
              onclick="changeQuantity(${i.id},1)"
            >
              +
            </button>


            <button
              class="delete-item"
              onclick="deleteCartItem(${i.id})"
            >
              🗑
            </button>

          </div>

        </div>

      </div>

    `;

  });


  document.getElementById(
    "summaryCount"
  ).textContent = count;


  document.getElementById(
    "subtotal"
  ).textContent =
    total.toLocaleString()+" ฿";


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString()+" ฿";

}

function addCategory(){

  const n =
    document
      .getElementById("newCategory")
      .value
      .trim();


  if(!n) return;


  if(shop.categories.includes(n)){

    alert("มีหมวดหมู่นี้แล้ว");

    return;

  }


  shop.categories.push(n);

  saveAll();

  renderCategories();

  showCategories();

}


function renameCategory(old){

  const input =
    document.getElementById(
      "cat-"+encodeURIComponent(old)
    );


  const n =
    input.value.trim();


  if(!n || n===old) return;


  shop.categories =
    shop.categories.map(
      c=>c===old ? n : c
    );


  products.forEach(p=>{

    if(p.category===old){
      p.category=n;
    }

  });


  if(currentCategory===old){
    currentCategory=n;
  }


  saveAll();

  renderCategories();

  renderProducts();

  renderHomeGrid();

  showCategories();

}


function deleteCategory(n){

  if(
    !confirm(
      "ต้องการลบหมวดหมู่นี้หรือไม่?"
    )
  ) return;


  shop.categories =
    shop.categories.filter(
      c=>c!==n
    );


  products.forEach(p=>{

    if(p.category===n){
      p.category="ทั้งหมด";
    }

  });


  if(currentCategory===n){
    currentCategory="ทั้งหมด";
  }


  saveAll();

  renderCategories();

  renderProducts();

  renderHomeGrid();

  showCategories();

}

function adminLogin(){

  closeMenu();


  const created =

    localStorage.setItem(
      "websiteCreatedAt",
      Date.now()
    );

  }


  const password =
    localStorage.getItem(
      "adminPassword"
    );


  if(!password){

    const age =
      Date.now() -

function setAdminPassword(){

  const p =
    document
      .getElementById("newPassword")
      .value;


  const c =
    document
      .getElementById("confirmPassword")
      .value;


  if(p.length<4){

    alert(
      "รหัสผ่านต้องมีอย่างน้อย 4 ตัว"
    );

    return;

  }


  if(p!==c){

    alert(
      "รหัสผ่านไม่ตรงกัน"
    );

    return;

  }


  localStorage.setItem(
    "adminPassword",
    p
  );


  alert(
    "ตั้งรหัสผ่านเรียบร้อย ♡"
  );


  showAdminSettings();

}


function checkAdminPassword(){

  if(
    document
      .getElementById(
        "adminPasswordInput"
      )
      .value !==
    localStorage.getItem(
      "adminPassword"
    )
  ){

    alert(
      "รหัสผ่านไม่ถูกต้อง"
    );

    return;

  }


  showAdminSettings();

}

/* =====================================================
   FILE READER
===================================================== */

function readFile(file,cb){

  if(!file){

    cb(null);

    return;

  }


  const r =
    new FileReader();


  r.onload =
    e=>cb(e.target.result);


  r.readAsDataURL(file);

}

/* =====================================================
   COPY
===================================================== */

function copyText(text){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    navigator.clipboard
      .writeText(text)
      .then(
        ()=>alert(
          "คัดลอกแล้ว ♡"
        )
      );

  }else{

    const t =
      document.createElement(
        "textarea"
      );


    t.value=text;

    document.body.appendChild(t);

    t.select();

    document.execCommand(
      "copy"
    );

    t.remove();


    alert(
      "คัดลอกแล้ว ♡"
    );

  }

}

/* =====================================================
   SLIP
===================================================== */

function previewSlip(e){

  const file =
    e.target.files[0];


  if(!file){

    selectedSlip="";

    return;

  }


  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    alert(
      "กรุณาแนบไฟล์รูปภาพเท่านั้น"
    );


    e.target.value="";

    return;

  }


  const r =
    new FileReader();


  r.onload =
    x=>{

      selectedSlip =
        x.target.result;


      document.getElementById(
        "slipPreview"
      ).innerHTML = `

        <img
          class="slip-preview"
          src="${selectedSlip}"
          alt="สลิป"
        >

      `;


      const b =
        document.getElementById(
          "confirmOrderBtn"
        );


      b.disabled=false;

      b.classList.remove(
        "confirm-disabled"
      );

    };


  r.readAsDataURL(file);

}

  }


  completeOrder(

}


/* =====================================================
   COMPLETE ORDER
===================================================== */

function completeOrder(
  payment,
  slip
){

  const orderNumber =
    "INV-"+Date.now();


  const total =
    cart.reduce(
      (s,i)=>
        s+
        i.price*
        i.quantity,
      0
    );


  const orders =
    JSON.parse(
      localStorage.getItem(
        "orders"
      ) || "[]"
    );


  orders.unshift({

    orderNumber,

    items:
      cart.map(
        i=>({...i})
      ),

    total,

    payment,

    slip,

    createdAt:
      new Date()
        .toISOString()

  });


  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );


  let items="";


  cart.forEach(i=>{

    items += `

      <div class="summary-row">

        <span>
          ${escapeHtml(i.name)}
          × ${i.quantity}
        </span>

        <span>
          ${(i.price*i.quantity)
            .toLocaleString()} ฿
        </span>

      </div>

    `;

  });


  showModal(`

    <div class="receipt">

      <div class="receipt-center">

        <h2>
          ♡ ${escapeHtml(shop.name)} ♡
        </h2>

        <div>
          ขอบคุณที่อุดหนุน ♡
        </div>

      </div>


      <div class="receipt-line"></div>


      <div>
        เลขที่ออเดอร์:
        <b>
          ${orderNumber}
        </b>
      </div>


      <div class="receipt-line"></div>


      ${items}


      <div class="receipt-line"></div>


      <div class="summary-row total">

        <span>
          รวมทั้งหมด
        </span>

        <span>
          ${total.toLocaleString()} ฿
        </span>

      </div>


      <div>
        วิธีชำระเงิน:
        ${payment}
      </div>


      <div class="receipt-line"></div>


      <div class="receipt-center">

        ♡ ส่งออเดอร์เรียบร้อย ♡

        <br>

        <small>
          รอตรวจสอบการชำระเงิน
        </small>

      </div>

    </div>


    <button
      class="modal-button"
      onclick="printReceipt()"
    >
      🧾 พิมพ์ใบเสร็จ
    </button>


    <button
      class="
        modal-button
        cancel-button
      "
      onclick="finishOrder()"
    >
      เสร็จสิ้น
    </button>

  `);

}


/* =====================================================
   PRINT
===================================================== */

function printReceipt(){

  const content =
    document
      .getElementById(
        "modalContent"
      )
      .innerHTML;


  const w =
    window.open(
      "",
      "",
      "width=500,height=700"
    );


  if(!w) return;


  w.document.write(`

    <html>

      <head>

        <title>
          Receipt
        </title>

        <style>

          body{
            font-family:Arial;
            padding:30px;
          }

          .summary-row{
            display:flex;
            justify-content:space-between;
            margin:10px 0;
          }

          .total{
            font-weight:bold;
            font-size:18px;
          }

        </style>

      </head>


      <body>

        ${content}

      </body>

    </html>

  `);


  w.document.close();

  w.print();

}
