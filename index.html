<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Shop ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #fff7fb;
    color: #665761;
}

/* ================= HEADER ================= */

header {
    margin: 15px;
    padding: 13px 18px;
    background: rgba(255,255,255,.96);
    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-shadow: 0 4px 20px rgba(255,150,190,.12);

    position: sticky;
    top: 10px;
    z-index: 50;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    background: #ffe5ef;
}

.logo h2 {
    margin: 0;
    font-size: 18px;
    color: #db82a8;
}

.logo p {
    margin: 3px 0 0;
    color: #ae9ba4;
    font-size: 11px;
}

/* ================= HAMBURGER ================= */

.menu-button {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 15px;

    background: #fff0f6;
    color: #dc82a8;

    font-size: 22px;
    cursor: pointer;
}

.menu-button:hover {
    background: #ffdcea;
}

/* ================= MENU ================= */

.side-menu {
    position: fixed;
    top: 0;
    right: -330px;

    width: 310px;
    height: 100vh;

    background: white;

    z-index: 200;

    padding: 25px;

    box-shadow: -5px 0 25px rgba(80,40,60,.12);

    transition: .3s;
}

.side-menu.open {
    right: 0;
}

.menu-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 20px;
    font-weight: bold;

    margin-bottom: 25px;
}

.close-menu {
    border: none;
    background: #fff0f6;
    color: #d883a5;

    width: 35px;
    height: 35px;

    border-radius: 12px;
    cursor: pointer;
}

.menu-item {
    width: 100%;

    border: none;
    background: #fff7fa;

    color: #806b74;

    padding: 15px;

    margin-bottom: 10px;

    border-radius: 15px;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.menu-item:hover {
    background: #ffe4ef;
}

/* ================= MAIN ================= */

.container {
    padding: 0 18px 80px;
}

.search {
    width: 100%;

    border: none;
    outline: none;

    background: white;

    padding: 16px 20px;

    border-radius: 18px;

    box-shadow: 0 3px 15px rgba(255,150,190,.08);
}

.categories {
    display: flex;
    gap: 8px;

    overflow-x: auto;

    padding: 12px 0;
}

.category {
    border: 1px solid #f3d4e1;

    background: white;

    color: #9b7d8a;

    border-radius: 20px;

    padding: 9px 15px;

    white-space: nowrap;

    cursor: pointer;
}

.category.active {
    background: #f6a4c5;
    color: white;
}

/* ================= PRODUCTS ================= */

.products {
    display: grid;

    grid-template-columns:
        repeat(auto-fill,minmax(170px,1fr));

    gap: 15px;
}

.product {
    background: white;

    padding: 10px;

    border-radius: 20px;

    box-shadow:
        0 4px 15px rgba(255,150,190,.09);
}

/* ================= รูปสินค้า ================= */

.product-image {
    width: 100%;
    height: 220px;

    object-fit: cover;

    border-radius: 15px;

    background: #fff0f6;

    display: block;
}

/*
    ระบบขนาด Pixel
    width / height จะถูกกำหนดจากข้อมูลสินค้า
*/

.product-name {
    font-size: 14px;
    font-weight: bold;

    margin: 10px 4px 3px;
}

.product-category {
    font-size: 11px;

    color: #b6a3ab;

    margin: 0 4px;
}

.product-bottom {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-top: 10px;
}

.price {
    color: #df7ca4;
    font-weight: bold;
}

.add {
    border: none;

    background: #f5a0c2;

    color: white;

    border-radius: 12px;

    padding: 8px 12px;

    cursor: pointer;
}

/* ================= CART BUTTON ================= */

.cart-button {
    position: fixed;

    right: 22px;
    bottom: 22px;

    width: 62px;
    height: 62px;

    border: none;

    border-radius: 50%;

    background: #f49bc0;

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 100;

    box-shadow:
        0 7px 25px rgba(230,100,150,.3);
}

.cart-count {
    position: absolute;

    top: -4px;
    right: -4px;

    background: #db618f;

    color: white;

    min-width: 22px;
    height: 22px;

    border-radius: 50%;

    font-size: 11px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* ================= CART PANEL ================= */

.cart-panel {
    position: fixed;

    right: 0;
    top: 0;

    width: 380px;
    height: 100vh;

    background: white;

    z-index: 150;

    padding: 22px;

    transform: translateX(100%);

    transition: .3s;

    box-shadow:
        -5px 0 25px rgba(80,40,60,.12);

    display: flex;
    flex-direction: column;
}

.cart-panel.open {
    transform: translateX(0);
}

.cart-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 20px;
    font-weight: bold;
}

.cart-close {
    border: none;

    background: #fff0f6;

    color: #d681a5;

    width: 35px;
    height: 35px;

    border-radius: 12px;

    cursor: pointer;
}

.cart-list {
    flex: 1;

    overflow-y: auto;

    margin-top: 15px;
}

.cart-item {
    display: flex;

    gap: 10px;

    padding: 10px 0;

    border-bottom:
        1px dashed #eadbe2;

    cursor: grab;
}

.cart-item.dragging {
    opacity: .4;
}

.cart-image {
    width: 55px;
    height: 55px;

    border-radius: 12px;

    object-fit: cover;
}

.cart-info {
    flex: 1;
}

.cart-name {
    font-size: 13px;
    font-weight: bold;
}

.cart-price {
    color: #df7ca4;

    font-size: 12px;

    margin-top: 4px;
}

.quantity {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 6px;
}

.quantity button {
    width: 24px;
    height: 24px;

    border: none;

    border-radius: 8px;

    background: #ffe5ef;

    color: #d97c9f;

    cursor: pointer;
}

.delete-item {
    border: none;

    background: none;

    color: #bca7b0;

    cursor: pointer;
}

/* ================= SUMMARY ================= */

.summary {
    border-top:
        1px dashed #e2d2da;

    padding-top: 15px;
}

.summary-row {
    display: flex;

    justify-content: space-between;

    margin: 8px 0;

    font-size: 13px;
}

.total {
    color: #df77a2;

    font-size: 19px;

    font-weight: bold;
}

.checkout {
    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 17px;

    margin-top: 12px;

    background: #f49bc0;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

/* ================= MODAL ================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(70,40,55,.28);

    z-index: 300;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;

    max-width: 470px;

    max-height: 90vh;

    overflow-y: auto;

    background: white;

    border-radius: 25px;

    padding: 25px;
}

.modal-title {
    font-size: 21px;

    font-weight: bold;

    color: #d77fa3;

    margin-bottom: 18px;
}

.input {
    width: 100%;

    padding: 13px;

    border: 1px solid #f0dce5;

    outline: none;

    border-radius: 13px;

    margin: 5px 0 10px;
}

.pixel-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.pixel-box {
    background: #fff7fa;
    border: 1px solid #f0dce5;
    border-radius: 15px;
    padding: 10px;
}

.pixel-box label {
    display: block;
    font-size: 11px;
    color: #a98c98;
    margin-bottom: 5px;
}

.pixel-box input {
    width: 100%;
    border: none;
    outline: none;
    background: white;
    padding: 10px;
    border-radius: 10px;
}

.modal-button {
    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 15px;

    background: #f39bc0;

    color: white;

    cursor: pointer;

    margin-top: 8px;
}

.cancel-button {
    background: #fff0f5;

    color: #bd8fa2;
}

/* ================= ADMIN ================= */

.admin-section {
    border-top: 1px dashed #ead9e1;

    margin-top: 18px;

    padding-top: 15px;
}

.admin-row {
    display: flex;

    gap: 7px;

    align-items: center;

    margin-bottom: 8px;
}

.admin-row input {
    flex: 1;

    padding: 10px;

    border: 1px solid #f0dce5;

    border-radius: 12px;

    outline: none;
}

.admin-row button {
    border: none;

    padding: 10px 12px;

    border-radius: 11px;

    background: #ffe4ef;

    color: #c97e9d;

    cursor: pointer;
}

.admin-image-preview {
    width: 100%;
    max-height: 180px;
    object-fit: contain;
    background: #fff7fa;
    border-radius: 15px;
    margin-top: 5px;
}

/* ================= RECEIPT ================= */

.receipt {
    background: #fffafd;

    border: 1px dashed #e4bdce;

    border-radius: 15px;

    padding: 18px;
}

.receipt-center {
    text-align: center;
}

.receipt-line {
    border-top:
        1px dashed #decbd3;

    margin: 12px 0;
}

/* ================= FLOATING BOTTOM BAR ================= */

.bottom-bar {
    position: fixed;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    width: min(92%, 600px);

    min-height: 62px;

    background: rgba(255,255,255,.96);

    border-radius: 22px;

    box-shadow:
        0 6px 25px rgba(100,50,70,.15);

    display: flex;

    align-items: center;

    justify-content: space-around;

    padding: 8px;

    z-index: 90;
}

.bottom-bar button {
    border: none;

    background: transparent;

    color: #a17f8d;

    border-radius: 15px;

    padding: 9px 13px;

    cursor: pointer;

    font-size: 12px;
}

.bottom-bar button.active,
.bottom-bar button:hover {
    background: #ffe5ef;
    color: #d8789f;
}

.bottom-bar.hidden {
    display: none;
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .cart-panel {
        width: 100%;
    }

    .side-menu {
        width: 85%;
    }

    .products {
        grid-template-columns:
            repeat(2,1fr);
    }

    .product-image {
        height: 180px;
    }

    .pixel-row {
        grid-template-columns: 1fr 1fr;
    }

    .bottom-bar {
        bottom: 10px;
    }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <img
            id="logoImage"
            class="logo-img"
            src="https://via.placeholder.com/100/ffe1ed/ffffff?text=♡"
        >

        <div>

            <h2 id="shopName">
                ♡ My Cute Shop ♡
            </h2>

            <p id="shopDescription">
                ♡ Thank you for support ♡
            </p>

        </div>

    </div>

    <button
        class="menu-button"
        onclick="openMenu()"
    >
        ☰
    </button>

</header>


<!-- ================= SIDE MENU ================= -->

<div
    id="sideMenu"
    class="side-menu"
>

    <div class="menu-title">

        <span>เมนู</span>

        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            ×
        </button>

    </div>

    <button
        class="menu-item"
        onclick="showCategories()"
    >
        ♡ หมวดหมู่สินค้า
    </button>

    <button
        class="menu-item"
        onclick="contactAdmin()"
    >
        ♡ ติดต่อแอดมิน
    </button>

    <button
        class="menu-item"
        onclick="adminLogin()"
    >
        ⚙ ตั้งค่าเว็บ
    </button>

</div>


<!-- ================= SHOP ================= -->

<div class="container">

    <input
        id="search"
        class="search"
        placeholder="ค้นหาสินค้า..."
    >

    <div
        id="categories"
        class="categories"
    ></div>

    <div
        id="products"
        class="products"
    ></div>

</div>


<!-- ================= CART BUTTON ================= -->

<button
    class="cart-button"
    onclick="openCart()"
>

    🛒

    <span
        id="cartCount"
        class="cart-count"
    >
        0
    </span>

</button>


<!-- ================= CART ================= -->

<div
    id="cartPanel"
    class="cart-panel"
>

    <div class="cart-header">

        <span>
            🛒 สรุปออเดอร์
        </span>

        <button
            class="cart-close"
            onclick="closeCart()"
        >
            ×
        </button>

    </div>

    <small style="color:#b8a4ad">
        ลากสินค้าเพื่อจัดเรียงลำดับ
    </small>

    <div
        id="cartList"
        class="cart-list"
    ></div>

    <div class="summary">

        <div class="summary-row">

            <span>
                รายการสินค้า
            </span>

            <span id="summaryCount">
                0
            </span>

        </div>

        <div class="summary-row">

            <span>
                ยอดสินค้า
            </span>

            <span id="subtotal">
                0 ฿
            </span>

        </div>

        <div class="summary-row total">

            <span>
                รวมทั้งหมด
            </span>

            <span id="total">
                0 ฿
            </span>

        </div>

        <button
            class="checkout"
            onclick="openCheckout()"
        >
            ชำระเงิน
        </button>

    </div>

</div>


<!-- ================= BOTTOM BAR ================= -->

<div id="bottomBar" class="bottom-bar">

    <button
        class="active"
        onclick="scrollToTop()"
    >
        🏠<br>
        หน้าร้าน
    </button>

    <button onclick="showCategories()">
        ♡<br>
        หมวดหมู่
    </button>

    <button onclick="openCart()">
        🛒<br>
        ตะกร้า
    </button>

    <button onclick="contactAdmin()">
        💌<br>
        ติดต่อ
    </button>

</div>


<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="modal"
>

    <div
        id="modalContent"
        class="modal-box"
    ></div>

</div>


<script>

/* ==================================================
   DATA
================================================== */

let shop = JSON.parse(
    localStorage.getItem("shopData")
) || {

    name: "♡ My Cute Shop ♡",

    description:
        "♡ Thank you for support ♡",

    logo:
        "https://via.placeholder.com/100/ffe1ed/ffffff?text=♡",

    categories: [
        "ทั้งหมด",
        "ของแต่ง",
        "สติ๊กเกอร์",
        "ของสะสม",
        "สินค้าใหม่"
    ]

};


let products = JSON.parse(
    localStorage.getItem("products")
) || [

    {
        id: 1,
        name: "แฮร์บัวใส่กล่อง",
        price: 199,
        category: "ของแต่ง",
        image:
        "https://via.placeholder.com/500/ffe4ef/ffffff?text=Product",

        /* ขนาดรูปเป็น Pixel */
        imageWidth: 300,
        imageHeight: 300
    },

    {
        id: 2,
        name: "สติ๊กเกอร์หัวใจ",
        price: 59,
        category: "สติ๊กเกอร์",
        image:
        "https://via.placeholder.com/500/ffeaf2/ffffff?text=Sticker",

        imageWidth: 300,
        imageHeight: 300
    }

];


let cart = JSON.parse(
    localStorage.getItem("cartData")
) || [];


let currentCategory = "ทั้งหมด";

let adminLoggedIn = false;


/* ==================================================
   SAVE
================================================== */

function saveAll() {

    localStorage.setItem(
        "shopData",
        JSON.stringify(shop)
    );

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    localStorage.setItem(
        "cartData",
        JSON.stringify(cart)
    );

}


/* ==================================================
   SHOP HEADER
================================================== */

function renderShop() {

    document.getElementById("shopName")
        .textContent = shop.name;

    document.getElementById("shopDescription")
        .textContent = shop.description;

    document.getElementById("logoImage")
        .src = shop.logo;

}


/* ==================================================
   CATEGORY
================================================== */

function renderCategories() {

    const box =
        document.getElementById("categories");

    box.innerHTML = "";

    shop.categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category" +
            (
                currentCategory === category
                ? " active"
                : ""
            );

        button.textContent = category;

        button.onclick = () => {

            currentCategory = category;

            renderCategories();
            renderProducts();

        };

        box.appendChild(button);

    });

}


/* ==================================================
   PRODUCTS
================================================== */

function renderProducts() {

    const box =
        document.getElementById("products");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    box.innerHTML = "";

    products

    .filter(product => {

        const category =
            currentCategory === "ทั้งหมด" ||
            product.category === currentCategory;

        const searchMatch =
            product.name
                .toLowerCase()
                .includes(search);

        return category && searchMatch;

    })

    .forEach(product => {

        /*
            ถ้าเป็นสินค้าเก่าที่ไม่มี Pixel
            ให้ใช้ 300 x 300 เป็นค่าเริ่มต้น
        */

        const imageWidth =
            product.imageWidth || 300;

        const imageHeight =
            product.imageHeight || 300;


        box.innerHTML += `

        <div class="product">

            <img
                class="product-image"
                src="${product.image}"
                style="
                    width:${imageWidth}px;
                    height:${imageHeight}px;
                    max-width:100%;
                "
            >

            <div class="product-name">
                ${product.name}
            </div>

            <div class="product-category">
                ${product.category}
            </div>

            <div class="product-bottom">

                <span class="price">
                    ${product.price.toLocaleString()} ฿
                </span>

                <button
                    class="add"
                    onclick="addToCart(${product.id})"
                >
                    ＋ เพิ่ม
                </button>

            </div>

        </div>

        `;

    });

}


/* ==================================================
   SEARCH
================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    renderProducts
);


/* ==================================================
   CART
================================================== */

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    const existing =
        cart.find(p => p.id === id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    saveAll();

    renderCart();

}


function changeQuantity(id, amount) {

    const item =
        cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(p => p.id !== id);

    }

    saveAll();

    renderCart();

}


function deleteCartItem(id) {

    cart =
        cart.filter(p => p.id !== id);

    saveAll();

    renderCart();

}


/* ==================================================
   CART RENDER
================================================== */

function renderCart() {

    const box =
        document.getElementById("cartList");

    box.innerHTML = "";

    let count = 0;

    let total = 0;


    cart.forEach((item,index) => {

        count += item.quantity;

        total +=
            item.price * item.quantity;


        const div =
            document.createElement("div");

        div.className = "cart-item";

        div.draggable = true;

        div.dataset.index = index;


        div.innerHTML = `

            <img
                class="cart-image"
                src="${item.image}"
            >

            <div class="cart-info">

                <div class="cart-name">
                    ${item.name}
                </div>

                <div class="cart-price">
                    ${item.price.toLocaleString()} ฿
                </div>

                <div class="quantity">

                    <button
                        onclick="changeQuantity(
                            ${item.id},-1
                        )"
                    >
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        onclick="changeQuantity(
                            ${item.id},1
                        )"
                    >
                        +
                    </button>

                    <button
                        class="delete-item"
                        onclick="deleteCartItem(
                            ${item.id}
                        )"
                    >
                        🗑
                    </button>

                </div>

            </div>
        `;


        div.addEventListener(
            "dragstart",
            () => {

                div.classList.add(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "dragend",
            () => {

                div.classList.remove(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "dragover",
            event => {

                event.preventDefault();

                const dragging =
                    document.querySelector(
                        ".dragging"
                    );

                if (
                    dragging &&
                    dragging !== div
                ) {

                    const from =
                        Number(
                            dragging.dataset.index
                        );

                    const to =
                        Number(
                            div.dataset.index
                        );


                    const moved =
                        cart.splice(from,1)[0];

                    cart.splice(to,0,moved);

                    saveAll();

                    renderCart();

                }

            }
        );


        box.appendChild(div);

    });


    document.getElementById("cartCount")
        .textContent = count;

    document.getElementById("summaryCount")
        .textContent = count;

    document.getElementById("subtotal")
        .textContent =
        total.toLocaleString() + " ฿";

    document.getElementById("total")
        .textContent =
        total.toLocaleString() + " ฿";

}

================================================== */

function addCategory() {

    const name =
        document.getElementById(
            "newCategory"
        ).value.trim();

    if (!name) return;

    if (shop.categories.includes(name)) {

        alert("มีหมวดหมู่นี้แล้ว");

        return;

    }

    shop.categories.push(name);

    saveAll();

    renderCategories();

    showCategories();

}


function renameCategory(oldName) {

    const input =
        document.getElementById(
            "cat-" + oldName
        );

    const newName =
        input.value.trim();

    if (
        !newName ||
        newName === oldName
    ) return;


    shop.categories =
        shop.categories.map(category =>
            category === oldName
            ? newName
            : category
        );


    products.forEach(product => {

        if (
            product.category === oldName
        ) {

            product.category = newName;

        }

    });


    if (
        currentCategory === oldName
    ) {

        currentCategory = newName;

    }


    saveAll();

    renderCategories();

    renderProducts();

    showCategories();

}


function deleteCategory(name) {

    if (
        !confirm(
            "ต้องการลบหมวดหมู่นี้หรือไม่?"
        )
    ) return;


    shop.categories =
        shop.categories.filter(
            c => c !== name
        );


    products.forEach(product => {

        if (
            product.category === name
        ) {

            product.category =
                "ทั้งหมด";

        }

    });


    if (
        currentCategory === name
    ) {

        currentCategory = "ทั้งหมด";

    }


    saveAll();

    renderCategories();

    renderProducts();

    showCategories();

}

function adminLogin() {

    closeMenu();

    const created =
        localStorage.getItem(
            "websiteCreatedAt"
        );


    if (!created) {

        localStorage.setItem(
            "websiteCreatedAt",
            Date.now()
        );

    }


    const password =
        localStorage.getItem(
            "adminPassword"
        );


    if (!password) {

        const age =
            Date.now() -
            Number(
                localStorage.getItem(

            );

    showModal(`

function saveNewProduct() {

    const name =
        document.getElementById(
            "productName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );

    const category =
        document.getElementById(
            "productCategory"
        ).value;

    const width =
        Number(
            document.getElementById(
                "productWidth"
            ).value
        ) || 300;

    const height =
        Number(
            document.getElementById(
                "productHeight"
            ).value
        ) || 300;

    const file =
        document.getElementById(
            "productImage"
        ).files[0];


    if (
        !name ||
        !price ||
        !file
    ) {

        alert(
            "กรุณากรอกข้อมูลให้ครบ"
        );

        return;

    }


    if (
        width < 50 ||
        height < 50 ||
        width > 2000 ||
        height > 2000
    ) {

        alert(
            "ขนาดรูปต้องอยู่ระหว่าง 50 - 2000 px"
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload = event => {

        products.push({

            id: Date.now(),

            name,

            price,

            category,

            image:
                event.target.result,

            /* บันทึก Pixel ไปกับสินค้า */

            imageWidth:
                width,

            imageHeight:
                height

        });


        saveAll();

        renderProducts();

        showAdminSettings();

    };


    reader.readAsDataURL(file);

}

function saveEditedProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );


    if (!product) return;


    product.name =
        document.getElementById(
            "editProductName"
        ).value;

    product.price =
        Number(
            document.getElementById(
                "editProductPrice"
            ).value
        );

    product.category =
        document.getElementById(
            "editProductCategory"
        ).value;


    /* บันทึก Pixel ใหม่ */

    product.imageWidth =
        Number(
            document.getElementById(
                "editProductWidth"
            ).value
        ) || 300;


    product.imageHeight =
        Number(
            document.getElementById(
                "editProductHeight"
            ).value
        ) || 300;


    const file =
        document.getElementById(
            "editProductImage"
        ).files[0];


    if (
        product.imageWidth < 50 ||
        product.imageHeight < 50 ||
        product.imageWidth > 2000 ||
        product.imageHeight > 2000
    ) {

        alert(
            "ขนาดรูปต้องอยู่ระหว่าง 50 - 2000 px"
        );

        return;

    }


    if (file) {

        const reader =
            new FileReader();


        reader.onload = event => {

            product.image =
                event.target.result;

            finishEditProduct();

        };


        reader.readAsDataURL(file);

    } else {

            เสร็จสิ้น
        </button>

    `);

}


/* ==================================================
   PRINT RECEIPT
================================================== */

function printReceipt() {

    const content =
        document.getElementById(
            "modalContent"
        ).innerHTML;


    const win =
        window.open(
            "",
            "",
            "width=500,height=700"
        );


    win.document.write(`

        <html>

        <head>

            <title>Receipt</title>

            <style>

                body {
                    font-family: Arial;
                    padding: 30px;
                }

                .summary-row {
                    display:flex;
                    justify-content:space-between;
                    margin:10px 0;
                }

                .total {
                    font-weight:bold;
                    font-size:18px;
                }

            </style>

        </head>

        <body>

            ${content}

        </body>

        </html>

    `);


    win.document.close();

    win.print();

}
