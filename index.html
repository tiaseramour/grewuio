<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cute Shop ♡</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #fff7fb;
    color: #665761;
}

/* ================= HEADER ================= */

header {
    margin: 15px;
    padding: 13px 18px;
    background: rgba(255,255,255,.96);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255,150,190,.12);
    position: sticky;
    top: 10px;
    z-index: 50;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    background: #ffe5ef;
}

.logo h2 {
    margin: 0;
    font-size: 18px;
    color: #db82a8;
}

.logo p {
    margin: 3px 0 0;
    color: #ae9ba4;
    font-size: 11px;
}

.menu-button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 15px;
    background: #fff0f6;
    color: #dc82a8;
    font-size: 22px;
    cursor: pointer;
}

.menu-button:hover {
    background: #ffdcea;
}

/* ================= MENU ================= */

.side-menu {
    position: fixed;
    top: 0;
    right: -330px;
    width: 310px;
    height: 100vh;
    background: white;
    z-index: 200;
    padding: 25px;
    box-shadow: -5px 0 25px rgba(80,40,60,.12);
    transition: .3s;
}

.side-menu.open {
    right: 0;
}

.menu-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.close-menu {
    border: none;
    background: #fff0f6;
    color: #d883a5;
    width: 35px;
    height: 35px;
    border-radius: 12px;
    cursor: pointer;
}

.menu-item {
    width: 100%;
    border: none;
    background: #fff7fa;
    color: #806b74;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 15px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.menu-item:hover {
    background: #ffe4ef;
}

/* ================= PROFILE HOME ================= */

.profile-page {
    padding: 0 18px 110px;
}

.profile-card {
    max-width: 850px;
    margin: 0 auto;
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(255,150,190,.12);
}

.profile-banner {
    width: 100%;
    height: 280px;
    background: #ffe5ef center/cover no-repeat;
}

.profile-content {
    position: relative;
    padding: 65px 25px 25px;
}

.profile-avatar {
    position: absolute;
    left: 25px;
    top: -70px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid white;
    background: #ffe5ef;
}

.profile-name {
    font-size: 24px;
    font-weight: bold;
    color: #d97c9f;
}

.profile-bio {
    margin-top: 8px;
    color: #9b858e;
    line-height: 1.6;
    white-space: pre-wrap;
}

.profile-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.profile-button {
    border: 1px solid #f1c9d9;
    background: white;
    color: #d67c9e;
    padding: 11px 20px;
    border-radius: 15px;
    cursor: pointer;
    font-weight: bold;
}

.profile-button.main {
    background: #f39bc0;
    color: white;
    border-color: #f39bc0;
}

/* ================= PRODUCT PAGE ================= */

#productPage {
    display: none;
}

.container {
    padding: 0 18px 110px;
    max-width: 1000px;
    margin: auto;
}

.page-title {
    font-size: 24px;
    font-weight: bold;
    color: #d77fa3;
    margin: 10px 0;
}

.search {
    width: 100%;
    border: none;
    outline: none;
    background: white;
    padding: 16px 20px;
    border-radius: 18px;
    box-shadow: 0 3px 15px rgba(255,150,190,.08);
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0;
}

.category {
    border: 1px solid #f3d4e1;
    background: white;
    color: #9b7d8a;
    border-radius: 20px;
    padding: 9px 15px;
    white-space: nowrap;
    cursor: pointer;
}

.category.active {
    background: #f6a4c5;
    color: white;
}

/* ================= PRODUCTS ================= */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
    gap: 15px;
}

.product {
    background: white;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(255,150,190,.09);
    overflow: hidden;
}

.product-image-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 15px;
    background: #fff0f6;
}

.product-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

.product-name {
    font-size: 14px;
    font-weight: bold;
    margin: 10px 4px 3px;
}

.product-category {
    font-size: 11px;
    color: #b6a3ab;
    margin: 0 4px;
}

.product-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

.price {
    color: #df7ca4;
    font-weight: bold;
}

.add {
    border: none;
    background: #f5a0c2;
    color: white;
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
}

/* ================= CART ================= */

.cart-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 380px;
    height: 100vh;
    background: white;
    z-index: 150;
    padding: 22px;
    transform: translateX(100%);
    transition: .3s;
    box-shadow: -5px 0 25px rgba(80,40,60,.12);
    display: flex;
    flex-direction: column;
}

.cart-panel.open {
    transform: translateX(0);
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
}

.cart-close {
    border: none;
    background: #fff0f6;
    color: #d681a5;
    width: 35px;
    height: 35px;
    border-radius: 12px;
    cursor: pointer;
}

.cart-list {
    flex: 1;
    overflow-y: auto;
    margin-top: 15px;
}

.cart-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed #eadbe2;
}

.cart-image {
    width: 55px;
    height: 55px;
    border-radius: 12px;
    object-fit: cover;
}

.cart-info {
    flex: 1;
}

.cart-name {
    font-size: 13px;
    font-weight: bold;
}

.cart-price {
    color: #df7ca4;
    font-size: 12px;
    margin-top: 4px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
}

.quantity button {
    width: 24px;
    height: 24px;
    border: none;
    border-radius: 8px;
    background: #ffe5ef;
    color: #d97c9f;
    cursor: pointer;
}

.delete-item {
    border: none;
    background: none;
    color: #bca7b0;
    cursor: pointer;
}

/* ================= SUMMARY ================= */

.summary {
    border-top: 1px dashed #e2d2da;
    padding-top: 15px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin: 8px 0;
    font-size: 13px;
}

.total {
    color: #df77a2;
    font-size: 19px;
    font-weight: bold;
}

.checkout {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 17px;
    margin-top: 12px;
    background: #f49bc0;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* ================= MODAL ================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(70,40,55,.28);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 25px;
    padding: 25px;
}

.modal-title {
    font-size: 21px;
    font-weight: bold;
    color: #d77fa3;
    margin-bottom: 18px;
}

.input {
    width: 100%;
    padding: 13px;
    border: 1px solid #f0dce5;
    outline: none;
    border-radius: 13px;
    margin: 5px 0 10px;
}

.modal-button {
    width: 100%;
    border: none;
    padding: 13px;
    border-radius: 15px;
    background: #f39bc0;
    color: white;
    cursor: pointer;
    margin-top: 8px;
}

.cancel-button {
    background: #fff0f5;
    color: #bd8fa2;
}

/* ================= CHECKOUT TABLE ================= */

.checkout-table {
    width: 100%;
    margin-top: 10px;
}

.checkout-row {
    display: grid;
    grid-template-columns: 1.7fr .55fr .9fr .9fr;
    gap: 8px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px dashed #eadbe2;
    font-size: 13px;
}

.checkout-row.header {
    font-weight: bold;
    color: #b1778f;
    border-bottom: 1px solid #efd9e2;
}

.checkout-total {
    display: flex;
    justify-content: space-between;
    padding: 15px 0;
    font-size: 18px;
    font-weight: bold;
    color: #d9779d;
}

/* ================= PAYMENT PAGE ================= */

.payment-box {
    border: 1px solid #f0dce5;
    border-radius: 22px;
    padding: 20px;
    background: #fffafd;
}

.payment-name {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #d77fa3;
    margin-bottom: 12px;
}

.payment-line {
    border-top: 1px dashed #decbd3;
    margin: 15px 0;
}

.payment-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 12px 0;
}

.payment-label {
    font-weight: bold;
    color: #9b7b88;
}

.payment-value {
    display: flex;
    align-items: center;
    gap: 7px;
    text-align: right;
}

.copy-button {
    border: none;
    background: #ffe5ef;
    color: #cf779b;
    padding: 7px 10px;
    border-radius: 10px;
    cursor: pointer;
}

.note-box {
    background: white;
    border: 1px solid #f0dce5;
    border-radius: 15px;
    padding: 13px;
}

.note-text {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.qr-title {
    text-align: center;
    margin-top: 18px;
    font-weight: bold;
    color: #a27d8c;
}

.qr-image {
    width: min(100%, 280px);
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    margin: 12px auto;
    border-radius: 15px;
    background: #fff0f6;
}

.slip-section {
    margin-top: 20px;
}

.slip-label {
    display: block;
    text-align: center;
    border: 2px dashed #f0abc5;
    border-radius: 15px;
    padding: 16px;
    color: #d77fa3;
    cursor: pointer;
    background: #fff7fa;
}

.slip-label input {
    display: none;
}

.slip-preview {
    width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 15px;
    margin-top: 12px;
    display: none;
}

.confirm-order {
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: 2px solid #f39bc0;
    background: #f39bc0;
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}

.confirm-order:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* ================= ADMIN ================= */

.admin-section {
    border-top: 1px dashed #ead9e1;
    margin-top: 18px;
    padding-top: 15px;
}

.admin-row {
    display: flex;
    gap: 7px;
    align-items: center;
    margin-bottom: 8px;
}

.admin-row input {
    flex: 1;
    padding: 10px;
    border: 1px solid #f0dce5;
    border-radius: 12px;
    outline: none;
}

.admin-row button {
    border: none;
    padding: 10px 12px;
    border-radius: 11px;
    background: #ffe4ef;
    color: #c97e9d;
    cursor: pointer;
}

/* ================= RECEIPT ================= */

.receipt {
    background: #fffafd;
    border: 1px dashed #e4bdce;
    border-radius: 15px;
    padding: 18px;
}

.receipt-center {
    text-align: center;
}

.receipt-line {
    border-top: 1px dashed #decbd3;
    margin: 12px 0;
}

/* ================= BOTTOM BAR ================= */

.bottom-bar {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    width: min(92%, 600px);
    min-height: 62px;
    background: rgba(255,255,255,.96);
    border-radius: 22px;
    box-shadow: 0 6px 25px rgba(100,50,70,.15);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px;
    z-index: 90;
}

.bottom-bar button {
    border: none;
    background: transparent;
    color: #a17f8d;
    border-radius: 15px;
    padding: 9px 13px;
    cursor: pointer;
    font-size: 12px;
}

.bottom-bar button.active,
.bottom-bar button:hover {
    background: #ffe5ef;
    color: #d8789f;
}

.bottom-bar.hidden {
    display: none;
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    .cart-panel {
        width: 100%;
    }

    .side-menu {
        width: 85%;
    }

    .products {
        grid-template-columns: repeat(2,1fr);
    }

    .profile-banner {
        height: 190px;
    }

    .profile-avatar {
        width: 105px;
        height: 105px;
        top: -55px;
    }

    .profile-content {
        padding-top: 60px;
    }

    .profile-name {
        font-size: 21px;
    }

    .checkout-row {
        grid-template-columns: 1.4fr .5fr .8fr .8fr;
        font-size: 11px;
    }

    .payment-row {
        align-items: flex-start;
    }

    .payment-value {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">

        <img
            id="logoImage"
            class="logo-img"
            src="https://via.placeholder.com/100/ffe1ed/ffffff?text=♡"
        >

        <div>
            <h2 id="shopName">♡ My Cute Shop ♡</h2>

            <p id="shopDescription">
                ♡ Thank you for support ♡
            </p>
        </div>

    </div>

    <button
        class="menu-button"
        onclick="openMenu()"
    >
        ☰
    </button>

</header>


<!-- ================= SIDE MENU ================= -->

<div id="sideMenu" class="side-menu">

    <div class="menu-title">

        <span>เมนู</span>

        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            ×
        </button>

    </div>

    <button
        class="menu-item"
        onclick="showProducts()"
    >
        🛍 สินค้า
    </button>

    <button
        class="menu-item"
        onclick="contactAdmin()"
    >
        ♡ ติดต่อแอดมิน
    </button>

    <button
        class="menu-item"
        onclick="adminLogin()"
    >
        ⚙ ตั้งค่าเว็บ
    </button>

</div>


<!-- ================= HOME PROFILE ================= -->

<section
    id="profilePage"
    class="profile-page"
>

    <div class="profile-card">

        <div
            id="profileBanner"
            class="profile-banner"
        ></div>

        <div class="profile-content">

            <img
                id="profileAvatar"
                class="profile-avatar"
                src="https://via.placeholder.com/150/ffe1ed/ffffff?text=♡"
            >

            <div
                id="profileName"
                class="profile-name"
            >
                ♡ My Cute Shop ♡
            </div>

            <div
                id="profileBio"
                class="profile-bio"
            >
                ♡ Thank you for support ♡
            </div>

            <div class="profile-buttons">

                <button
                    class="profile-button main"
                    onclick="showProducts()"
                >
                    🛍 ดูสินค้า
                </button>

                <button
                    class="profile-button"
                    onclick="contactAdmin()"
                >
                    ติดต่อ
                </button>

            </div>

        </div>

    </div>

</section>


<!-- ================= PRODUCT PAGE ================= -->

<section id="productPage">

    <div class="container">

        <div class="page-title">
            ♡ สินค้า
        </div>

        <input
            id="search"
            class="search"
            placeholder="ค้นหาสินค้า..."
        >

        <div
            id="categories"
            class="categories"
        ></div>

        <div
            id="products"
            class="products"
        ></div>

    </div>

</section>


<!-- ================= CART ================= -->

<div
    id="cartPanel"
    class="cart-panel"
>

    <div class="cart-header">

        <span>🛒 สรุปออเดอร์</span>

        <button
            class="cart-close"
            onclick="closeCart()"
        >
            ×
        </button>

    </div>

    <div
        id="cartList"
        class="cart-list"
    ></div>

    <div class="summary">

        <div class="summary-row">

            <span>รายการสินค้า</span>

            <span id="summaryCount">
                0
            </span>

        </div>

        <div class="summary-row">

            <span>ยอดสินค้า</span>

            <span id="subtotal">
                0 ฿
            </span>

        </div>

        <div class="summary-row total">

            <span>รวมทั้งหมด</span>

            <span id="total">
                0 ฿
            </span>

        </div>

        <button
            class="checkout"
            onclick="openCheckout()"
        >
            ชำระเงิน
        </button>

    </div>

</div>


<!-- ================= BOTTOM BAR ================= -->

<div
    id="bottomBar"
    class="bottom-bar"
>

    <button
        id="homeButton"
        class="active"
        onclick="showHome()"
    >
        🏠<br>
        หน้าร้าน
    </button>

    <button
        id="productButton"
        onclick="showProducts()"
    >
        ♡<br>
        สินค้า
    </button>

    <button onclick="openCart()">
        🛒<br>
        ตะกร้า
    </button>

    <button onclick="contactAdmin()">
        💌<br>
        ติดต่อ
    </button>

</div>


<!-- ================= MODAL ================= -->

<div
    id="modal"
    class="modal"
>

    <div
        id="modalContent"
        class="modal-box"
    ></div>

</div>


<script>

/* ================= DATA ================= */

let shop =
    JSON.parse(localStorage.getItem("shopData"))
    || {

        name: "♡ My Cute Shop ♡",

        description:
            "♡ Thank you for support ♡",

        logo:
            "https://via.placeholder.com/100/ffe1ed/ffffff?text=♡",

        banner:
            "https://via.placeholder.com/1200x400/ffdce9/ffffff?text=Banner",

        categories: [
            "ทั้งหมด",
            "ของแต่ง",
            "สติ๊กเกอร์",
            "ของสะสม",
            "สินค้าใหม่"
        ],

        payment: {

            name: "Akines",

            bankNumber:
                "000-0-0000000",

            walletNumber:
                "000-000-0000",

            note:
                "ข้อความ",

            qr:
                "https://via.placeholder.com/500/ffffff/333333?text=QR"

        }

    };


/* เพิ่มข้อมูลสำหรับเว็บเก่าที่ไม่มี banner/payment */

if (!shop.banner) {

    shop.banner =
        "https://via.placeholder.com/1200x400/ffdce9/ffffff?text=Banner";

}

if (!shop.payment) {

    shop.payment = {

        name: "Akines",

        bankNumber: "000-0-0000000",

        walletNumber: "000-000-0000",

        note: "ข้อความ",

        qr:
            "https://via.placeholder.com/500/ffffff/333333?text=QR"

    };

}


let products =
    JSON.parse(localStorage.getItem("products"))
    || [

        {
            id: 1,
            name: "แฮร์บัวใส่กล่อง",
            price: 199,
            category: "ของแต่ง",
            image:
            "https://via.placeholder.com/500/ffe4ef/ffffff?text=Product"
        },

        {
            id: 2,
            name: "สติ๊กเกอร์หัวใจ",
            price: 59,
            category: "สติ๊กเกอร์",
            image:
            "https://via.placeholder.com/500/ffeaf2/ffffff?text=Sticker"
        }

    ];


let cart =
    JSON.parse(localStorage.getItem("cartData"))
    || [];


let currentCategory = "ทั้งหมด";

let selectedSlip = null;


/* ================= SAVE ================= */

function saveAll() {

    localStorage.setItem(
        "shopData",
        JSON.stringify(shop)
    );

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

    localStorage.setItem(
        "cartData",
        JSON.stringify(cart)
    );

}


/* ================= SHOP ================= */

function renderShop() {

    document.getElementById("shopName")
        .textContent = shop.name;

    document.getElementById("shopDescription")

/* ================= CART ================= */

function addToCart(id) {

    const product =
        products.find(p => p.id === id);

    if (!product) return;

    const existing =
        cart.find(p => p.id === id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            ...product,
            quantity: 1
        });

    }

    saveAll();

    renderCart();

}


function changeQuantity(id, amount) {

    const item =
        cart.find(p => p.id === id);

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        cart =
            cart.filter(p => p.id !== id);

    }

    saveAll();

    renderCart();

}


function deleteCartItem(id) {

    cart =
        cart.filter(p => p.id !== id);

    saveAll();

    renderCart();

}


/* ================= CART RENDER ================= */

function renderCart() {

    const box =
        document.getElementById("cartList");

    box.innerHTML = "";

    let count = 0;
    let total = 0;


    cart.forEach(item => {

        count += item.quantity;

        total +=
            item.price * item.quantity;


        const div =
            document.createElement("div");

        div.className = "cart-item";


        div.innerHTML = `

            <img
                class="cart-image"
                src="${item.image}"
            >

            <div class="cart-info">

                <div class="cart-name">
                    ${item.name}
                </div>

                <div class="cart-price">
                    ${item.price.toLocaleString()} ฿
                </div>

                <div class="quantity">

                    <button
                        onclick="changeQuantity(${item.id},-1)"
                    >
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        onclick="changeQuantity(${item.id},1)"
                    >
                        +
                    </button>

                    <button
                        class="delete-item"
                        onclick="deleteCartItem(${item.id})"
                    >
                        🗑
                    </button>

                </div>

            </div>

        `;

        box.appendChild(div);

    });


    document.getElementById("summaryCount")
        .textContent = count;

    document.getElementById("subtotal")
        .textContent =
        total.toLocaleString() + " ฿";

    document.getElementById("total")
        .textContent =
        total.toLocaleString() + " ฿";

}

function addCategory() {

    const name =
        document.getElementById(
            "newCategory"
        ).value.trim();

    if (!name) return;

    if (shop.categories.includes(name)) {

        alert("มีหมวดหมู่นี้แล้ว");

        return;

    }

    shop.categories.push(name);

    saveAll();

    renderCategories();

    showCategories();

}


function renameCategory(oldName) {

    const input =
        document.getElementById(
            "cat-" + oldName
        );

    const newName =
        input.value.trim();

    if (
        !newName ||
        newName === oldName
    ) return;


    shop.categories =
        shop.categories.map(category =>
            category === oldName
            ? newName
            : category
        );


    products.forEach(product => {

        if (
            product.category === oldName
        ) {

            product.category = newName;

        }

    });


    if (
        currentCategory === oldName
    ) {

        currentCategory = newName;

    }


    saveAll();

    renderCategories();

    renderProducts();

    showCategories();

}


function deleteCategory(name) {

    if (
        !confirm(
            "ต้องการลบหมวดหมู่นี้หรือไม่?"
        )
    ) return;


    shop.categories =
        shop.categories.filter(
            c => c !== name
        );


    products.forEach(product => {

        if (
            product.category === name
        ) {

            product.category =
                "ทั้งหมด";

        }

    });


    if (
        currentCategory === name
    ) {

        currentCategory = "ทั้งหมด";

    }


    saveAll();

    renderCategories();

    renderProducts();

    showCategories();

}

/* ================= SAVE SHOP ================= */

function saveShopSettings() {

    shop.name =
        document.getElementById(
            "editShopName"
        ).value;

    shop.description =
        document.getElementById(
            "editDescription"
        ).value;

    shop.payment.name =
        document.getElementById(
            "paymentName"
        ).value;

    shop.payment.bankNumber =
        document.getElementById(
            "paymentBank"
        ).value;

    shop.payment.walletNumber =
        document.getElementById(
            "paymentWallet"
        ).value;

    shop.payment.note =
        document.getElementById(
            "paymentNote"
        ).value;


    const logoFile =
        document.getElementById(
            "logoFile"
        ).files[0];

    const bannerFile =
        document.getElementById(
            "bannerFile"
        ).files[0];

    const qrFile =
        document.getElementById(
            "qrFile"
        ).files[0];


    let files = [];

    if (logoFile) {

        files.push({
            file: logoFile,
            type: "logo"
        });

    }

    if (bannerFile) {

        files.push({
            file: bannerFile,
            type: "banner"
        });

    }

    if (qrFile) {

        files.push({
            file: qrFile,
            type: "qr"
        });

    }


    function readNext(index) {

        if (index >= files.length) {

            saveAll();

            renderShop();

            alert(
                "บันทึกข้อมูลร้านแล้ว ♡"
            );

            return;

        }


        const item = files[index];

        const reader =
            new FileReader();


        reader.onload = event => {

            if (item.type === "logo") {

                shop.logo =
                    event.target.result;

            }

            if (item.type === "banner") {

                shop.banner =
                    event.target.result;

            }

            if (item.type === "qr") {

                shop.payment.qr =
                    event.target.result;

            }

            readNext(index + 1);

        };


        reader.readAsDataURL(item.file);

    }


    readNext(0);

}

/* ================= COPY ================= */

function copyText(text) {

    navigator.clipboard
        .writeText(text)
        .then(() => {

            alert(
                "คัดลอกแล้ว ♡"
            );

        })
        .catch(() => {

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand("copy");

            textarea.remove();

            alert(
                "คัดลอกแล้ว ♡"
            );

        });

}


/* ================= SLIP ================= */

function previewSlip(event) {

    const file =
        event.target.files[0];

    const preview =
        document.getElementById(
            "slipPreview"
        );

    const button =
        document.getElementById(
            "confirmOrderButton"
        );


    if (!file) {

        selectedSlip = null;

        preview.style.display = "none";

        button.disabled = true;

        return;

    }


    if (!file.type.startsWith("image/")) {

        alert(
            "กรุณาเลือกไฟล์รูปภาพเท่านั้น"
        );

        event.target.value = "";

        selectedSlip = null;

        button.disabled = true;

        return;

    }


    const reader =
        new FileReader();


    reader.onload = e => {

        selectedSlip =
            e.target.result;

        preview.src =
            selectedSlip;

        preview.style.display =
            "block";

        button.disabled =
            false;

    };


    reader.readAsDataURL(file);

}
