<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>♡ My Cute Shop ♡</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff7fb;
  color:#604a56;
  padding-bottom:82px;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================
 ICONS
========================= */

.icon{
  width:22px;
  height:22px;
  display:inline-block;
  vertical-align:middle;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon.small{
  width:18px;
  height:18px;
}

.icon.large{
  width:28px;
  height:28px;
}

/* =========================
 HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  height:65px;
  padding:8px 15px;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-btn,
.cart-btn{
  width:45px;
  height:45px;
  border-radius:14px;
  background:#fff0f6;
  color:#d56894;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.shop-mini{
  flex:1;
  text-align:center;
}

.shop-mini-name{
  font-size:16px;
  font-weight:800;
  color:#684d59;
}

.shop-mini-status{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:800;
  margin-top:3px;
  padding:4px 9px;
  border-radius:20px;
}

.status-open{
  color:#3e9d67;
  background:rgba(101,197,134,.13);
  border:1px solid rgba(101,197,134,.22);
}

.status-close{
  color:#d45d68;
  background:rgba(223,104,115,.13);
  border:1px solid rgba(223,104,115,.22);
}

.cart-btn{
  position:relative;
}

.cart-count{
  position:absolute;
  top:-4px;
  right:-4px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  background:#e77da6;
  color:#fff;
  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
 PAGES
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
 HOME
========================= */

.hero{
  max-width:1100px;
  margin:auto;
  padding:18px 15px 20px;
}

.banner{
  width:100%;
  height:190px;
  border-radius:24px;
  overflow:hidden;
  background:#ffe2ed;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile{
  text-align:center;
  margin-top:-48px;
  position:relative;
}

.avatar{
  width:96px;
  height:96px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid #fff;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
}

.shop-name{
  margin:8px 0 2px;
  color:#c85f88;
  font-size:25px;
}

.shop-description{
  margin-top:5px;
  color:#987d89;
}

.home-box{
  max-width:700px;
  margin:20px auto;
  padding:18px;
  background:#fff;
  border:1px solid #f2dfe7;
  border-radius:20px;
  text-align:center;
}

.home-box h3{
  margin-top:0;
  color:#c76089;
}

.home-product-title{
  max-width:1100px;
  margin:20px auto 10px;
  padding:0 15px;
  font-size:18px;
  font-weight:800;
  color:#c45d86;
}

/* =========================
 PRODUCTS
========================= */

.products-page{
  max-width:1100px;
  margin:auto;
  padding:15px 15px 30px;
}

.page-title{
  text-align:center;
  color:#c65f87;
  margin:8px 0 15px;
}

.search-box{
  width:100%;
  padding:13px 15px;
  background:#fff;
  border:1px solid #efdbe5;
  border-radius:16px;
  outline:none;
  margin-bottom:12px;
}

.search-box:focus{
  border-color:#e78dac;
}

.category-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 14px;
  scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
  display:none;
}

.category-btn{
  white-space:nowrap;
  padding:9px 15px;
  border-radius:20px;
  border:1px solid #efd8e3;
  background:#fff;
  color:#9b6d80;
}

.category-btn.active{
  background:#e982aa;
  color:#fff;
  border-color:#e982aa;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.product-card{
  background:#fff;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #f1dfe7;
  box-shadow:0 3px 15px rgba(110,60,90,.06);
}

.product-img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#fff0f6;
  cursor:pointer;
}

.product-body{
  padding:11px;
}

.product-name{
  font-weight:800;
  color:#684e5b;
}

.product-description{
  font-size:12px;
  color:#9b858f;
  margin-top:5px;
  min-height:32px;
}

.price{
  margin-top:8px;
  font-weight:800;
  color:#d26694;
}

.old-price{
  color:#b9a5ae;
  text-decoration:line-through;
  font-size:12px;
  margin-right:5px;
}

.sale-badge{
  display:inline-block;
  margin-top:5px;
  padding:4px 7px;
  background:#ffe1ec;
  color:#d35c89;
  border-radius:8px;
  font-size:10px;
}

.add-btn{
  width:100%;
  margin-top:9px;
  padding:10px;
  background:#e983aa;
  color:#fff;
  border-radius:13px;
}

.add-btn:disabled{
  background:#ccc;
}

/* =========================
 CONTACT
========================= */

.contact-page{
  max-width:700px;
  margin:auto;
  padding:25px 15px 35px;
}

.contact-card{
  background:#fff;
  border:1px solid #f0dfe7;
  border-radius:22px;
  padding:20px;
  margin-bottom:12px;
  text-align:center;
}

.contact-button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:14px;
  margin-top:10px;
  border-radius:15px;
  background:#fff0f5;
  color:#c45e86;
  font-weight:700;
}

/* =========================
 BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:70;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #f0dfe7;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  box-shadow:0 -3px 15px rgba(0,0,0,.05);
}

.bottom-nav button{
  background:none;
  color:#a17b8c;
  font-size:10px;
}

.bottom-nav button.active{
  color:#dc6e99;
  font-weight:800;
}

.bottom-icon{
  display:flex;
  justify-content:center;
  align-items:center;
  height:30px;
  margin-bottom:3px;
}

/* =========================
 SIDE MENU
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(40,25,35,.28);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.side-menu{
  position:fixed;
  top:0;
  right:-340px;
  width:min(340px,90vw);
  height:100%;
  background:#fff;
  z-index:100;
  transition:.3s;
  padding:20px;
  overflow:auto;
  box-shadow:-10px 0 30px rgba(0,0,0,.13);
}

.side-menu.open{
  right:0;
}

.menu-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:800;
  color:#c65f87;
  margin-bottom:20px;
}

.close-btn{
  width:37px;
  height:37px;
  border-radius:50%;
  background:#fff0f5;
  color:#d26691;
  font-size:22px;
}

.menu-item{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:#fff7fa;
  color:#765866;
  padding:14px;
  border-radius:14px;
  margin-bottom:9px;
}

/* =========================
 MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  padding:18px;
  background:rgba(40,25,35,.45);
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  box-shadow:0 15px 50px rgba(0,0,0,.22);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  padding:16px 20px;
  background:#fff;
  border-bottom:1px solid #f1e2e7;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  color:#c55e87;
  font-weight:800;
  font-size:18px;
}

.modal-body{
  padding:20px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-control{
  width:100%;
  padding:11px 12px;
  border:1px solid #ead9e0;
  border-radius:13px;
  outline:none;
  background:#fff;
}

.form-control:focus{
  border-color:#e68eae;
}

textarea.form-control{
  min-height:100px;
  resize:vertical;
}

.primary{
  padding:11px 16px;
  border-radius:13px;
  background:#e983aa;
  color:#fff;
}

.secondary{
  padding:11px 16px;
  border-radius:13px;
  background:#fff0f5;
  color:#c5638b;
}

.danger{
  padding:9px 12px;
  border-radius:10px;
  background:#ffe6e8;
  color:#d35c67;
}

.item-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
  flex-wrap:wrap;
}

.row{
  display:flex;
  gap:9px;
  align-items:center;
}

.setting-card{
  padding:15px;
  border:1px solid #efdee6;
  border-radius:18px;
  background:#fffafd;
  margin-bottom:13px;
}

.setting-card h4{
  margin:0 0 12px;
  color:#c45e86;
}

.dm-item,
.category-item,
.admin-product-item,
.order-item{
  background:#fff;
  border:1px solid #efdee6;
  border-radius:15px;
  padding:12px;
  margin-bottom:9px;
}

/* =========================
 SETTINGS MENU
========================= */

.settings-menu-title{
  font-size:13px;
  color:#b08d9b;
  font-weight:800;
  margin:16px 0 8px;
  text-transform:none;
}

.settings-menu-button{
  width:100%;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:15px;
  margin-bottom:9px;
  border-radius:16px;
  background:#fff7fa;
  border:1px solid #f1e1e8;
  color:#765866;
}

.settings-menu-button-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.settings-menu-arrow{
  color:#c993a9;
}

/* =========================
 SWITCH
========================= */

.switch{
  position:relative;
  display:inline-block;
  width:52px;
  height:30px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#ddd;
  border-radius:30px;
}

.slider:before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  top:3px;
  left:3px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#65c586;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* =========================
 STATUS
========================= */

.status-preview{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:8px 13px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.mode-choice{
  border:1px solid #f0dfe7;
  border-radius:16px;
  padding:13px;
  margin-bottom:9px;
}

.mode-choice.selected{
  border-color:#e983aa;
  background:#fff5f9;
}

/* =========================
 CART
========================= */

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f0e3e8;
}

.cart-item img{
  width:65px;
  height:65px;
  border-radius:12px;
  object-fit:cover;
}

.cart-info{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:7px;
}

.qty button{
  width:28px;
  height:28px;
  border-radius:9px;
  background:#fff0f5;
  color:#c5638b;
}

/* =========================
 EMPTY
========================= */

.empty{
  text-align:center;
  padding:40px 20px;
  color:#aa929d;
}

/* =========================
 ORDER ALERT
========================= */

.order-alert{
  position:fixed;
  z-index:500;
  top:15px;
  left:50%;
  width:min(420px,90%);
  padding:15px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  border:1px solid #f0d8e3;
  transform:translate(-50%,-130px);
  transition:.3s;
}

.order-alert.show{
  transform:translate(-50%,0);
}

.alert-title{
  font-weight:800;
  color:#d15e89;
}

/* =========================
 RESPONSIVE
========================= */

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .banner{
    height:150px;
  }

  .shop-name{
    font-size:22px;
  }

  .product-body{
    padding:9px;
  }

  .modal-overlay{
    padding:10px;
  }

  .modal{
    max-height:94vh;
    border-radius:20px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="header-inner">

    <button class="menu-btn" onclick="openMenu()" aria-label="เมนู">
      <svg class="icon"><use href="#i-menu"></use></svg>
    </button>

    <div class="shop-mini">
      <div class="shop-mini-name" id="miniShopName">
        ♡ My Cute Shop ♡
      </div>

      <div class="shop-mini-status" id="miniShopStatus"></div>
    </div>

    <button class="cart-btn" onclick="goToPage('cart')" aria-label="ตะกร้า">
      <svg class="icon"><use href="#i-cart"></use></svg>
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>

<!-- HOME -->
<section id="page-home" class="page active">

  <div class="hero">

    <div class="banner">
      <img id="bannerImage"
           src="https://placehold.co/1200x350/ffddea/c95f89?text=♡+My+Cute+Shop+♡">
    </div>

    <div class="profile">

      <img id="profileImage"
           class="avatar"
           src="https://placehold.co/200x200/ffe5ef/c95f89?text=♡">

      <h1 class="shop-name" id="shopName">
        ♡ My Cute Shop ♡
      </h1>

      <div class="shop-description" id="shopDescription">
        ♡ Thank you for support ♡
      </div>

    </div>

  </div>

  <div class="home-box">
    <h3>♡ ยินดีต้อนรับ ♡</h3>

    <div>
      ขอบคุณที่แวะมาอุดหนุนร้านของเรานะคะ
    </div>

    <button class="primary"
            style="margin-top:15px"
            onclick="goToPage('products')">

      <svg class="icon small"><use href="#i-bag"></use></svg>
      ดูสินค้าทั้งหมด

    </button>
  </div>

  <div class="home-product-title">
    ✨ สินค้าแนะนำ
  </div>

  <div class="products"
       id="homeProducts"
       style="max-width:1100px;margin:auto;padding:0 15px 30px">
  </div>

</section>

<!-- PRODUCTS -->
<section id="page-products" class="page">

  <div class="products-page">

    <h2 class="page-title">
      <svg class="icon"><use href="#i-bag"></use></svg>
      สินค้าทั้งหมด
    </h2>

    <input class="search-box"
           id="searchInput"
           placeholder="🔎 ค้นหาสินค้า..."
           oninput="renderProducts()">

    <div class="category-bar" id="categoryBar"></div>

    <div class="products" id="productGrid"></div>

  </div>

</section>

<!-- CART -->
<section id="page-cart" class="page">

  <div class="products-page">

/* =====================================================

const DEFAULT_SHOP = {

  description:"♡ Thank you for support ♡",

  statusMode:"manual",

  autoOpenTime:"09:00",

  autoCloseTime:"22:00",

  profileImage:

  bannerImage:
    "https://placehold.co/1200x350/ffddea/c95f89?text=♡+My+Cute+Shop+♡",

  dmChannels:[
    {
      id:Date.now(),
      name:"LINE",
      url:"https://line.me/"
    },
    {
      id:Date.now()+1,
      name:"Facebook",
      url:"https://facebook.com/"
    }
  ],

  paymentName:"",

  paymentInfo:"",

  qrImage:
    "https://placehold.co/400x400/fff0f5/c95f89?text=QR"
};

const DEFAULT_CATEGORIES = [
  "ทั้งหมด",

  "สติ๊กเกอร์",
  "ของสะสม",
  "สินค้าใหม่"
];

const DEFAULT_PRODUCTS = [

  {
    id:1,

    price:59,
    category:"สติ๊กเกอร์",
    image:
      "https://placehold.co/600x600/ffe5ef/c95f89?text=Sticker",
    description:"สติ๊กเกอร์น่ารักสำหรับตกแต่ง",
    promotion:null
  },

  {
    id:2,
    name:"ของแต่งโต๊ะ",
    price:199,
    category:"ของแต่ง",
    image:
      "https://placehold.co/600x600/e9f7ff/7b9db4?text=Decor",
    description:"ของแต่งโต๊ะสุดน่ารัก",
    promotion:null
  }

];

/* =====================================================
 LOAD DATA
===================================================== */

let shop =
  JSON.parse(localStorage.getItem("shopData"))
  || JSON.parse(JSON.stringify(DEFAULT_SHOP));

let categories =
  JSON.parse(localStorage.getItem("categories"))
  || [...DEFAULT_CATEGORIES];

let products =
  JSON.parse(localStorage.getItem("products"))
  || [...DEFAULT_PRODUCTS];

let cart =
  JSON.parse(localStorage.getItem("cartData"))
  || [];

let orders =
  JSON.parse(localStorage.getItem("orders"))
  || [];

let selectedCategory = "ทั้งหมด";

let lastKnownOrderIds =
  JSON.parse(
    localStorage.getItem("lastKnownOrderIds") || "[]"
  );

/* รองรับข้อมูลเก่าจากเวอร์ชันเดิม */

if(!shop.statusMode){
  shop.statusMode = "manual";
}

if(!shop.autoOpenTime){
  shop.autoOpenTime = "09:00";
}

if(!shop.autoCloseTime){
  shop.autoCloseTime = "22:00";
}

if(!Array.isArray(shop.dmChannels)){
  shop.dmChannels = [];
}

products.forEach(p => {
  if(!p.promotion){
    p.promotion = null;
  }
});

/* =====================================================
 SAVE
===================================================== */

function saveAll(){

  localStorage.setItem(
    "shopData",
    JSON.stringify(shop)
  );

  localStorage.setItem(
    "categories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "cartData",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );
}

/* =====================================================
 SHOP STATUS
===================================================== */

function getShopOpenStatus(){

  if(shop.statusMode === "manual"){
    return !!shop.isOpen;
  }

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();

  const open =
    timeToMinutes(shop.autoOpenTime);

  const close =
    timeToMinutes(shop.autoCloseTime);

  if(open === close){
    return true;
  }

  if(open < close){
    return currentMinutes >= open &&
           currentMinutes < close;
  }

  return currentMinutes >= open ||
         currentMinutes < close;
}

function timeToMinutes(value){

  if(!value) return 0;

  const parts = value.split(":");

  return (
    Number(parts[0] || 0) * 60 +
    Number(parts[1] || 0)
  );
}

function renderShopStatus(){

  const isOpen =
    getShopOpenStatus();

  const text =
    isOpen ? "open" : "close";

  const cls =
    isOpen ? "status-open" : "status-close";

  const mini =
    document.getElementById(
      "miniShopStatus"
    );

  if(mini){

    mini.textContent = text;

    mini.className =
      "shop-mini-status " + cls;
  }

  document.querySelectorAll(
    ".shop-status-display"
  ).forEach(el => {

    el.textContent = text;
    el.className =
      "status-preview shop-status-display " + cls;

  });
}

function shopIsOpen(){

  return getShopOpenStatus();

}

/* =====================================================
 PAGE SYSTEM
===================================================== */

function goToPage(page){

  document.querySelectorAll(".page")
    .forEach(el =>
      el.classList.remove("active")
    );

  const target =
    document.getElementById(
      "page-" + page
    );

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(
    ".bottom-nav button"
  ).forEach(el =>
    el.classList.remove("active")
  );

  const nav =
    document.getElementById(
      "nav-" + page
    );

  if(nav){
    nav.classList.add("active");
  }

  if(page === "products"){
    renderCategories();
    renderProducts();
  }

  if(page === "cart"){
    renderCartPage();
  }

  if(page === "home"){
    renderHomeProducts();
  }

  if(page === "contact"){
    renderContact();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =====================================================
 SHOP RENDER
===================================================== */

function renderShop(){

  document.getElementById("shopName")
    .textContent = shop.name;

  document.getElementById("miniShopName")
    .textContent = shop.name;

  document.getElementById("shopDescription")
    .textContent = shop.description;

  document.getElementById("profileImage")
    .src = shop.profileImage;

  document.getElementById("bannerImage")
    .src = shop.bannerImage;

  renderShopStatus();

  renderContact();
}

/* =====================================================
 CONTACT
===================================================== */

function renderContact(){

  const box =
    document.getElementById(
      "contactChannels"
    );

  if(!box) return;

  if(!shop.dmChannels.length){

    box.innerHTML = `
      <div class="empty">
        ยังไม่มีช่องทาง DM
      </div>
    `;

    return;
  }

  box.innerHTML =
    shop.dmChannels.map(dm => `

      <button
        class="contact-button"
        onclick="openExternalLink(${JSON.stringify(dm.url)})">

        <svg class="icon small">
          <use href="#i-chat"></use>
        </svg>

        ${escapeHtml(dm.name)}

      </button>

    `).join("");
}

function openExternalLink(url){

  if(!url) return;

  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}

/* =====================================================
 CATEGORY
===================================================== */

function renderCategories(){

  const bar =
    document.getElementById("categoryBar");

  if(!bar) return;

  bar.innerHTML =
    categories.map(category => `

      <button
        class="category-btn ${
          category === selectedCategory
            ? "active"
            : ""
        }"
        onclick='selectCategory(${JSON.stringify(category)})'>

        ${escapeHtml(category)}

      </button>

    `).join("");
}

function selectCategory(category){

  selectedCategory = category;

  renderCategories();
  renderProducts();
}

/* =====================================================
 PROMOTION
===================================================== */

function isPromotionActive(product){

  const p = product.promotion;

  if(!p) return false;

  if(
    p.enabled === false
  ) return false;

  if(
    !p.start ||
    !p.end ||
    !p.salePrice
  ){
    return false;
  }

  const now = Date.now();

  const start =
    new Date(p.start).getTime();

  const end =
    new Date(p.end).getTime();

  return now >= start && now <= end;
}

function getProductPrice(product){

  if(
    isPromotionActive(product) &&
    product.promotion.salePrice
  ){

    return Number(
      product.promotion.salePrice
    );
  }

  return Number(product.price);
}

function getProductImage(product){

  if(
    isPromotionActive(product) &&
    product.promotion.promoImage
  ){

    return product.promotion.promoImage;
  }

  return product.image;
}

function getProductDescription(product){

  if(
    isPromotionActive(product) &&
    product.promotion.promoDescription
  ){

    return product.promotion.promoDescription;
  }

  return product.description;
}

/* =====================================================
 PRODUCT RENDER
===================================================== */

function renderProducts(){

  const grid =
    document.getElementById(
      "productGrid"
    );

  if(!grid) return;

  const keyword =
    (
      document.getElementById(
        "searchInput"
      )?.value || ""
    )
    .trim()
    .toLowerCase();

  const filtered =
    products.filter(product => {

      const categoryMatch =
        selectedCategory === "ทั้งหมด" ||
        product.category === selectedCategory;

      const searchMatch =
        String(product.name || "")
          .toLowerCase()
          .includes(keyword) ||

        String(product.description || "")
          .toLowerCase()
          .includes(keyword);

      return categoryMatch && searchMatch;
    });

  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        ไม่พบสินค้า
      </div>
    `;

    return;
  }

  grid.innerHTML =
    filtered.map(product =>
      productCardHTML(product)
    ).join("");
}

function productCardHTML(product){

  const active =
    isPromotionActive(product);

  const price =
    getProductPrice(product);

  const open =
    shopIsOpen();

  return `

    <article class="product-card">

      <img
        class="product-img"
        src="${escapeAttribute(
          getProductImage(product)
        )}"
        onclick="showProduct(${product.id})">

      <div class="product-body">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-description">
          ${escapeHtml(
            getProductDescription(product)
          )}
        </div>

        <div class="price">

          ${
            active
            ? `
              <span class="old-price">
                ${formatMoney(product.price)} ฿
              </span>
            `
            : ""
          }

          ${formatMoney(price)} ฿

        </div>

        ${
          active
          ? `
            <span class="sale-badge">
              โปรโมชั่น
            </span>
          `
          : ""
        }

        <button
          class="add-btn"
          onclick="addToCart(${product.id})"
          ${!open ? "disabled":""}>

          ${
            open
              ? "♡ เพิ่มลงตะกร้า"
              : "ร้านปิดอยู่"
          }

        </button>

      </div>

    </article>

  `;
}

/* =====================================================
 HOME PRODUCTS
===================================================== */

function renderHomeProducts(){

  const box =
    document.getElementById(
      "homeProducts"
    );

  if(!box) return;

  const list =
    products.slice(0,4);

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        ยังไม่มีสินค้า
      </div>
    `;

    return;
  }

  box.innerHTML =
    list.map(product =>
      productCardHTML(product)
    ).join("");
}

/* =====================================================
 PRODUCT DETAIL
===================================================== */

function showProduct(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;

  const active =
    isPromotionActive(product);

  const price =
    getProductPrice(product);

  const open =
    shopIsOpen();

  showModal(
    "รายละเอียดสินค้า",

    `

      <img
        src="${escapeAttribute(
          getProductImage(product)
        )}"
        style="
          width:100%;
          max-height:330px;
          object-fit:cover;
          border-radius:18px;
        ">

      <h2>
        ${escapeHtml(product.name)}
      </h2>

      <p>
        ${escapeHtml(
          getProductDescription(product)
        )}
      </p>

      <div
        class="price"
        style="font-size:22px">

        ${
          active
          ? `
            <span class="old-price">
              ${formatMoney(product.price)} ฿
            </span>
          `
          : ""
        }

        ${formatMoney(price)} ฿

      </div>

      ${
        active
        ? `
          <div class="sale-badge">
            โปรโมชั่นถึง
            ${formatDate(product.promotion.end)}
          </div>
        `
        : ""
      }

      <button
        class="primary"
        style="width:100%;margin-top:20px"
        onclick="
          addToCart(${product.id});
          closeModal();
        "
        ${!open ? "disabled":""}>

        ${
          open
            ? "♡ เพิ่มลงตะกร้า"
            : "ร้านปิดอยู่"
        }

      </button>

    `
  );
}

/* =====================================================
 CART
===================================================== */

function addToCart(id){

  if(!shopIsOpen()){

    alert("ตอนนี้ร้านปิดอยู่ค่ะ ♡");
    return;
  }

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;

  const existing =
    cart.find(
      item => item.id === id
    );

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      id,
      qty:1
    });
  }

  saveAll();

  renderCartCount();
  renderCartPage();
}

function changeQty(id,amount){

  const item =
    cart.find(
      x => x.id === id
    );

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    cart =
      cart.filter(
        x => x.id !== id
      );
  }

  saveAll();

  renderCartCount();
  renderCartPage();
}

function removeCart(id){

  cart =
    cart.filter(
      x => x.id !== id
    );

  saveAll();

  renderCartCount();
  renderCartPage();
}

function renderCartCount(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.qty,
      0
    );

  document.getElementById(
    "cartCount"
  ).textContent = count;
}

function cartTotal(){

  return cart.reduce(
    (sum,item) => {

      const product =
        products.find(
          p => p.id === item.id
        );

      if(!product)
        return sum;

      return sum +
        getProductPrice(product) *
        item.qty;

    },
    0
  );
}

function renderCartPage(){

  const box =
    document.getElementById(
      "cartPageContent"
    );

  if(!box) return;

  if(!cart.length){

    box.innerHTML = `

      <div class="home-box">

        <div style="font-size:45px">
          <svg class="icon large">
            <use href="#i-cart"></use>
          </svg>
        </div>

        <h3>
          ยังไม่มีสินค้าในตะกร้า
        </h3>

        <button
          class="primary"
          onclick="goToPage('products')">

          <svg class="icon small">
            <use href="#i-bag"></use>
          </svg>

          ไปเลือกสินค้า

        </button>

      </div>

    `;

    return;
  }

  box.innerHTML = `

    ${cart.map(item => {

      const p =
        products.find(
          x => x.id === item.id
        );

      if(!p) return "";

      return `

        <div class="cart-item">

          <img
            src="${escapeAttribute(
              getProductImage(p)
            )}">

          <div class="cart-info">

            <strong>
              ${escapeHtml(p.name)}
            </strong>

            <div>
              ${formatMoney(
                getProductPrice(p)
              )} ฿
            </div>

            <div class="qty">

              <button
                onclick="changeQty(${p.id},-1)">
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="changeQty(${p.id},1)">
                +
              </button>

              <button
                class="danger"
                onclick="removeCart(${p.id})">
                ลบ
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("")}

    <div
      style="
        margin-top:18px;
        display:flex;
        justify-content:space-between;
        font-weight:800;
        font-size:18px;
      ">

      <span>
        รวมทั้งหมด
      </span>

      <span style="color:#d36694">
        ${formatMoney(cartTotal())} ฿
      </span>

    </div>

    <button
      class="primary"
      style="width:100%;margin-top:15px"
      onclick="checkout()">

      ดำเนินการสั่งซื้อ ♡

    </button>

  `;
}

/* =====================================================
 CHECKOUT
===================================================== */

function checkout(){

  if(!cart.length){
    alert("ยังไม่มีสินค้าในตะกร้า");
    return;
  }

  if(!shopIsOpen()){
    alert("ร้านปิดอยู่ ไม่สามารถสั่งซื้อได้");
    return;
  }

  const orderNumber =
    createOrderNumber();

  const items =
    cart.map(item => {

      const p =
        products.find(
          x => x.id === item.id
        );

      return {
        id:p.id,
        name:p.name,
        qty:item.qty,
        price:getProductPrice(p),
        image:getProductImage(p)
      };

    });

  const total =
    items.reduce(
      (sum,item) =>
        sum +
        item.price *
        item.qty,
      0
    );

  showModal(
    "ยืนยันออเดอร์",

    `

      <div class="setting-card">

        <strong>
          เลขออเดอร์
        </strong>

        <div>
          ${orderNumber}
        </div>

        <hr>

        ${items.map(item => `

          <div
            style="
              display:flex;
              justify-content:space-between;
              margin:8px 0;
            ">

            <span>
              ${escapeHtml(item.name)}
              × ${item.qty}
            </span>

            <span>
              ${formatMoney(
                item.price *
                item.qty
              )} ฿
            </span>

          </div>

        `).join("")}

        <hr>

        <div
          style="
            display:flex;
            justify-content:space-between;
            font-weight:800;
          ">

          <span>รวม</span>

          <span>
            ${formatMoney(total)} ฿
          </span>

        </div>

      </div>

      <div class="form-group">

        <label>
          ชื่อผู้สั่งซื้อ
        </label>

        <input
          id="customerName"
          class="form-control"
          placeholder="ชื่อ">

      </div>

      <div class="form-group">

        <label>
          LINE / ช่องทางติดต่อ
        </label>

        <input
          id="customerContact"
          class="form-control"
          placeholder="@LINE หรือข้อมูลติดต่อ">

      </div>

      <button
        class="primary"
        style="width:100%"
        onclick="showPayment('${orderNumber}')">

        ไปชำระเงิน ♡

      </button>

    `
  );
}

function createOrderNumber(){

  const date =
    new Date();

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth()+1)
      .padStart(2,"0");

  const d =
    String(date.getDate())
      .padStart(2,"0");

  const random =
    Math.floor(
      1000 + Math.random()*9000
    );

  return `ORD-${y}${m}${d}-${random}`;
}

/* =====================================================
 PAYMENT
===================================================== */

function showPayment(orderNumber){

  const name =
    document.getElementById(
      "customerName"
    ).value.trim();

  const contact =
    document.getElementById(
      "customerContact"
    ).value.trim();

  if(!contact){

    alert(
      "กรุณาใส่ช่องทางติดต่อ"
    );

    return;
  }

  const total =
    cartTotal();

  showModal(
    "ชำระเงิน",

    `

      <div style="text-align:center">

        <img

/* =====================================================
 FINISH ORDER
===================================================== */

function finishOrder(
  orderNumber,
  customerName,
  contact
){

  const file =
    document.getElementById(
      "slipFile"
    ).files[0];

  const createOrder =
    slipImage => {

      const items =
        cart.map(item => {

          const p =
            products.find(
              x => x.id === item.id
            );

          return {
            id:p.id,
            name:p.name,
            qty:item.qty,
            price:getProductPrice(p),
            image:getProductImage(p)
          };

        });

      const total =
        items.reduce(
          (sum,item) =>
            sum +
            item.price *
            item.qty,
          0
        );

      const order = {

        id:orderNumber,

        createdAt:
          new Date().toISOString(),

        customerName,

        contact,

        items,

        total,

        slip:
          slipImage || "",

        viewed:false

      };

      orders.unshift(order);

      cart = [];

      saveAll();

      renderCartCount();
      renderCartPage();

      closeModal();

      showReceipt(order);

      triggerAdminOrderAlert(order);

      lastKnownOrderIds.unshift(order.id);

      lastKnownOrderIds =
        [...new Set(lastKnownOrderIds)]
          .slice(0,100);

      localStorage.setItem(
        "lastKnownOrderIds",
        JSON.stringify(
          lastKnownOrderIds
        )
      );
    };

  if(file){

    const reader =
      new FileReader();

    reader.onload =
      () =>
        createOrder(
          reader.result
        );

    reader.readAsDataURL(file);

  }else{

    createOrder("");
  }
}

/* =====================================================

===================================================== */

const PASSWORD_LIFETIME =
  7 * 24 * 60 * 60 * 1000;

const LOGIN_REMEMBER_TIME =
  30 * 24 * 60 * 60 * 1000;

function openMenu(){

  const password =
    localStorage.getItem(
      "adminPassword"
    );

  const passwordCreated =
    Number(
      localStorage.getItem(
        "adminPasswordCreatedAt"
      )
    );

  const rememberLogin =
    Number(
      localStorage.getItem(
        "adminRememberLoginAt"
      )
    );

  if(
    !password ||
    !passwordCreated ||
    Date.now() - passwordCreated >=
      PASSWORD_LIFETIME
  ){

    showSetPasswordModal(
      password
        ? "รหัสผ่านหมดอายุแล้ว"
        : "ตั้งรหัสผ่านแอดมิน"
    );

    return;
  }

  if(
    rememberLogin &&
    Date.now() - rememberLogin <
      LOGIN_REMEMBER_TIME
  ){

    openProtectedMenu();
    return;
  }

  showLoginPasswordModal();
}

function showSetPasswordModal(title){

  showModal(

    `

      <p>
        ตั้งรหัสผ่านสำหรับเข้าเมนูแอดมิน
      </p>

      </div>

        <label>ยืนยันรหัสผ่าน</label>

function setAdminPassword(){

  const password =
    document.getElementById(
      "newAdminPassword"
    ).value;

  const confirm =
    document.getElementById(
      "confirmAdminPassword"
    ).value;

  if(password.length < 4){

    alert(
      "รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร"
    );

    return;
  }

  if(password !== confirm){

    alert(
      "รหัสผ่านไม่ตรงกัน"
    );

    return;
  }

  localStorage.setItem(
    "adminPassword",
    password
  );

  localStorage.setItem(
    "adminPasswordCreatedAt",
    Date.now()
  );

  localStorage.setItem(
    "adminRememberLoginAt",
    Date.now()
  );

  closeModal();

  openProtectedMenu();
}

function showLoginPasswordModal(){

  showModal(
    "ใส่รหัสผ่าน",

    `

      <p>
        กรุณาใส่รหัสผ่านเพื่อเข้าสู่เมนู
      </p>

      <div class="form-group">

        <input
          id="adminPasswordInput"

          type="password"
          placeholder="รหัสผ่าน">

      </div>

        style="
          display:flex;
          gap:8px;
          align-items:center;
          margin-bottom:15px;
          font-size:13px;
        ">

        <input
          id="rememberLogin"
          type="checkbox"
          checked>

        จำการเข้าสู่ระบบ 30 วัน

      </label>

      <button
        class="primary"
        style="width:100%"
        onclick="checkAdminPassword()">

        เข้าสู่เมนู

      </button>

    `
  );
}

function checkAdminPassword(){

  const input =
    document.getElementById(
      "adminPasswordInput"
    ).value;

  const password =
    localStorage.getItem(
      "adminPassword"
    );

  const passwordCreated =
    Number(
      localStorage.getItem(
        "adminPasswordCreatedAt"
      )
    );

  if(
    Date.now() - passwordCreated >=
      PASSWORD_LIFETIME
  ){

    closeModal();

    showSetPasswordModal(
      "รหัสผ่านหมดอายุแล้ว"
    );

    return;
  }

  if(input !== password){

    alert(
      "รหัสผ่านไม่ถูกต้อง"
    );

    return;
  }

  const remember =
    document.getElementById(
      "rememberLogin"
    ).checked;

  if(remember){

    localStorage.setItem(
      "adminRememberLoginAt",
      Date.now()
    );

  }else{

    localStorage.removeItem(
      "adminRememberLoginAt"
    );
  }

  closeModal();

  openProtectedMenu();
}

function openProtectedMenu(){

  document.getElementById(
    "sideMenu"
  ).classList.add("open");

  document.getElementById(
    "menuOverlay"
  ).classList.add("show");
}

function closeMenu(){

  document.getElementById(
    "sideMenu"
  ).classList.remove("open");

  document.getElementById(
    "menuOverlay"
  ).classList.remove("show");
}

  shop.statusMode =
    mode;

    ".mode-choice"

    el.classList.remove("selected")

  const selected =
    document.querySelector(
      `.mode-choice:has(input[value="${mode}"])`
    );

  if(selected){
    selected.classList.add("selected");
  }

  document.querySelectorAll(
    'input[name="statusMode"]'
  ).forEach(input => {
    input.checked =
      input.value === mode;
  });

  const box =
    document.getElementById(
      "statusModeOptions"
    );

  if(box){
    box.innerHTML =
      statusModeOptionsHTML();
  }

function saveCategory(){

    ).value.trim();

  if(!name){

    alert(

    );

    return;
  }

  if(categories.includes(name)){

    alert(
      "มีหมวดหมู่นี้อยู่แล้ว"
    );

    return;
  }

  categories.push(name);

  saveAll();

  selectedCategory = "ทั้งหมด";

  closeModal();

  renderCategories();
  renderProducts();

  openCategorySettingsPopup();
}

function renameCategory(oldName){

  showModal(
    "แก้ไขหมวดหมู่",

    `

      <div class="form-group">

        <label>
          ชื่อใหม่
        </label>

        <input
          id="renameCategoryInput"
          class="form-control"
          value="${escapeAttribute(oldName)}">

      </div>

      <button
        class="primary"
        style="width:100%"
        onclick="
          saveRenamedCategory(
            ${JSON.stringify(oldName)}
          )
        ">

        บันทึก

      </button>

    `
  );
}

function saveRenamedCategory(oldName){

  const newName =
    document.getElementById(
      "renameCategoryInput"
    ).value.trim();

  if(!newName) return;

  if(
    categories.includes(newName) &&
    newName !== oldName
  ){

    alert(
      "มีหมวดหมู่นี้อยู่แล้ว"
    );

    return;
  }

  const index =
    categories.indexOf(oldName);

  if(index !== -1){
    categories[index] =
      newName;
  }

  products.forEach(product => {

    if(product.category === oldName){

      product.category =
        newName;
    }

  });

  if(selectedCategory === oldName){
    selectedCategory =
      newName;
  }

  saveAll();

  closeModal();

  renderCategories();
  renderProducts();

  openCategorySettingsPopup();
}

function deleteCategory(name){

  if(
    !confirm(
      `ลบหมวดหมู่ "${name}" ใช่หรือไม่?`
    )
  ) return;

  categories =
    categories.filter(
      x => x !== name
    );

  products.forEach(product => {

    if(product.category === name){

      product.category =
        "ทั้งหมด";
    }

  });

  if(selectedCategory === name){

    selectedCategory =
      "ทั้งหมด";
  }

  saveAll();

  renderCategories();
  renderProducts();

  openCategorySettingsPopup();
}

async function saveNewProduct(){

  const name =
    document.getElementById(
      "productName"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value
    );

  const category =
    document.getElementById(
      "productCategory"
    ).value;

  const description =
    document.getElementById(
      "productDescription"
    ).value.trim();

  if(!name || price <= 0){

    alert(
      "กรุณากรอกชื่อและราคาสินค้า"
    );

    return;
  }

  const imageFile =
    document.getElementById(
      "productImageFile"
    ).files[0];

  const promoImageFile =
    document.getElementById(
      "promoImageFile"
    ).files[0];

  const image =
    await fileToDataURL(
      imageFile
    );

  const promoImage =
    await fileToDataURL(
      promoImageFile
    );

  const promoEnabled =
    document.getElementById(
      "promoEnabled"
    ).checked;

  const promoPrice =
    Number(
      document.getElementById(
        "promoPrice"
      ).value
    );

  const promoStart =
    document.getElementById(
      "promoStart"
    ).value;

  const promoEnd =
    document.getElementById(
      "promoEnd"
    ).value;

  const promoDescription =
    document.getElementById(
      "promoDescription"
    ).value.trim();

  let promotion = null;

  if(
    promoEnabled &&
    promoPrice > 0 &&
    promoStart &&
    promoEnd
  ){

    const start =
      new Date(promoStart);

    const end =
      new Date(promoEnd);

    if(end <= start){

      alert(
        "วันสิ้นสุดโปรโมชั่นต้องหลังวันเริ่ม"
      );

      return;
    }

    promotion = {

      enabled:true,

      salePrice:
        promoPrice,

      start:
        start.toISOString(),

      end:
        end.toISOString(),

      promoImage,

      promoDescription

    };
  }

  products.unshift({

    id:Date.now(),

    name,

    price,

    category,

    image:
      image ||
      "https://placehold.co/600x600/ffe5ef/c95f89?text=Product",

    description,

    promotion

  });

  saveAll();

  closeModal();

  renderProducts();
  renderHomeProducts();

  openProductSettingsPopup();
}

  renderHomeProducts();

}

function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;

  if(
    !confirm(
      `ต้องการลบ "${product.name}" หรือไม่?`
    )
  ) return;

  products =
    products.filter(
      p => p.id !== id
    );

  cart =
    cart.filter(
      item => item.id !== id
    );

  saveAll();

  renderProducts();
  renderHomeProducts();
  renderCartCount();
  renderCartPage();

  openProductSettingsPopup();
}

/*
  ตรวจออเดอร์ใหม่เป็นระยะ

  หมายเหตุ:
  localStorage ทำงานเฉพาะใน browser/origin เดียวกัน
  จึงไม่สามารถส่งออเดอร์แบบ real-time
  จากมือถือของลูกค้าไปมือถือแอดมินคนละเครื่องได้
*/

let knownOrdersForAlert =
  new Set(lastKnownOrderIds);

function checkForNewOrders(){

  const currentIds =
    orders.map(
      order => order.id
    );

  const newOrders =
    orders.filter(
      order =>
        !knownOrdersForAlert.has(order.id)
    );

  if(newOrders.length){

    const newest =
      newOrders[0];

    triggerAdminOrderAlert(newest);

    newOrders.forEach(
      order =>
        knownOrdersForAlert.add(order.id)
    );
  }

  currentIds.forEach(
    id =>
      knownOrdersForAlert.add(id)
  );
}

/* =====================================================
 IMAGE
===================================================== */

function previewImage(
  input,
  targetId
){

  const file =
    input.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload =
    e => {

      const target =
        document.getElementById(
          targetId
        );

      if(target){
        target.src =
          e.target.result;
      }

    };

  reader.readAsDataURL(file);
}

function fileToDataURL(file){

  return new Promise(
    resolve => {

      if(!file){

        resolve("");
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.onerror =
        () =>
          resolve("");

      reader.readAsDataURL(file);

    }
  );
}

/* =====================================================
 HELPERS
===================================================== */

function formatMoney(number){

  return Number(
    number || 0
  ).toLocaleString(
    "th-TH",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function formatDate(date){

  return new Date(date)
    .toLocaleString(
      "th-TH",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );
}

function toDateInput(date){

  if(!date) return "";

  const d =
    new Date(date);

  const pad =
    n =>
      String(n)
        .padStart(2,"0");

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );
}

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttribute(value){

  return escapeHtml(value)
    .replace(/`/g,"&#096;");
}
