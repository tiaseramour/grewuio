<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ My Cute Shop ♡</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff7fb;
  color:#5d4652;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* =========================
   HEADER
========================= */

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.menu-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#fff0f6;
  color:#d86c9a;
  font-size:23px;
}

.shop-mini{
  flex:1;
  text-align:center;
}

.shop-mini-name{
  font-size:17px;
  font-weight:800;
}

.shop-mini-status{
  font-size:8px;
  margin-top:2px;
}

.open-text{
  color:#48a96b;
}

.closed-text{
  color:#e06b76;
}

.cart-btn{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#fff0f6;
  color:#d86c9a;
  position:relative;
  font-size:21px;
}

.cart-count{
  position:absolute;
  right:-3px;
  top:-3px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  background:#e77ca7;
  color:white;
  border-radius:20px;
  font-size:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* =========================
   HERO
========================= */

.hero{
  max-width:1100px;
  margin:auto;
  padding:20px 16px 10px;
}

.banner{
  height:190px;
  border-radius:24px;
  overflow:hidden;
  background:#ffddea;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile{
  text-align:center;
  margin-top:-48px;
  position:relative;
}

.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  border:5px solid white;
  object-fit:cover;
  background:#ffe5ef;
  box-shadow:0 4px 18px rgba(0,0,0,.1);
}

.shop-name{
  margin:8px 0 2px;
  font-size:25px;
  color:#c95f89;
}

.shop-status{
  font-weight:700;
  font-size:14px;
}

.shop-description{
  margin:5px 0 0;
  color:#987d89;
}

/* =========================
   SEARCH
========================= */

.search-area{
  max-width:1100px;
  margin:auto;
  padding:15px 16px;
}

.search-box{
  background:white;
  border:1px solid #f2dce6;
  border-radius:16px;
  padding:12px 15px;
  width:100%;
  outline:none;
}

.search-box:focus{
  border-color:#e99abb;
}

/* =========================
   CATEGORY
========================= */

.category-bar{
  max-width:1100px;
  margin:auto;
  padding:0 16px 15px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.category-btn{
  white-space:nowrap;
  padding:9px 15px;
  border-radius:20px;
  background:#fff;
  border:1px solid #f1d8e3;
  color:#a26c82;
}

.category-btn.active{
  background:#e983aa;
  color:white;
}

/* =========================
   PRODUCTS
========================= */

.products{
  max-width:1100px;
  margin:auto;
  padding:0 16px 90px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(110,60,90,.06);
  border:1px solid #f4e1e9;
}

.product-img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#fff0f6;
}

.product-body{
  padding:12px;
}

.product-name{
  font-weight:800;
  color:#694f5c;
}

.product-description{
  font-size:12px;
  color:#9c858f;
  margin-top:5px;
  min-height:32px;
}

.price{
  margin-top:9px;
  font-weight:800;
  color:#d46694;
}

.old-price{
  color:#bba8b0;
  text-decoration:line-through;
  font-size:12px;
  margin-right:5px;
}

.sale-badge{
  display:inline-block;
  background:#ffe0eb;
  color:#d55d89;
  padding:3px 7px;
  border-radius:8px;
  font-size:10px;
  margin-top:6px;
}

.add-btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:13px;
  background:#e983aa;
  color:white;
}

.add-btn:disabled{
  background:#ccc;
  cursor:not-allowed;
}

/* =========================
   SIDE MENU
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(50,30,40,.25);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:90;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.side-menu{
  position:fixed;
  top:0;
  right:-330px;
  width:min(330px,90vw);
  height:100%;
  background:white;
  z-index:100;
  box-shadow:-8px 0 30px rgba(0,0,0,.12);
  transition:.3s;
  padding:20px;
  overflow:auto;
}

.side-menu.open{
  right:0;
}

.menu-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:800;
  color:#c95f89;
  margin-bottom:20px;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#fff0f5;
  color:#d36793;
  font-size:21px;
}

.menu-item{
  width:100%;
  text-align:left;
  background:#fff7fa;
  padding:14px;
  border-radius:14px;
  margin-bottom:9px;
  color:#795b68;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(40,25,35,.42);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-head{
  padding:17px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #f2e4e9;
  position:sticky;
  top:0;
  background:white;
  z-index:2;
}

.modal-title{
  font-weight:800;
  color:#c95f89;
  font-size:18px;
}

.modal-body{
  padding:20px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
  font-size:13px;
}

.form-control{
  width:100%;
  border:1px solid #ead8e0;
  border-radius:13px;
  padding:11px 12px;
  outline:none;
  background:white;
}

.form-control:focus{
  border-color:#e58eae;
}

textarea.form-control{
  min-height:100px;
  resize:vertical;
}

.primary{
  background:#e983aa;
  color:white;
  padding:11px 17px;
  border-radius:13px;
}

.secondary{
  background:#fff0f5;
  color:#c9638c;
  padding:11px 17px;
  border-radius:13px;
}

.danger{
  background:#ffe6e8;
  color:#d45c67;
  padding:9px 12px;
  border-radius:11px;
}

.row{
  display:flex;
  gap:9px;
  align-items:center;
}

.row > *{
  flex:1;
}

/* =========================
   SETTINGS
========================= */

.setting-tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:12px;
}

.setting-tab{
  white-space:nowrap;
  padding:9px 13px;
  border-radius:13px;
  background:#fff1f6;
  color:#9a687c;
}

.setting-tab.active{
  background:#e983aa;
  color:white;
}

.setting-section{
  display:none;
}

.setting-section.active{
  display:block;
}

.setting-card{
  border:1px solid #f0dfe6;
  border-radius:18px;
  padding:15px;
  margin-bottom:13px;
  background:#fffafd;
}

.setting-card h4{
  margin:0 0 12px;
  color:#c45e87;
}

.dm-item,
.category-item,
.admin-product-item,
.order-item{
  background:white;
  border:1px solid #efdfe6;
  border-radius:15px;
  padding:12px;
  margin-bottom:9px;
}

.item-actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.item-actions button{
  padding:8px 11px;
  border-radius:10px;
}

/* =========================
   SWITCH
========================= */

.switch-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.switch{
  position:relative;
  width:52px;
  height:30px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#ddd;
  border-radius:30px;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#65c586;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}

/* =========================
   CART
========================= */

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f0e4e8;
}

.cart-item img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:12px;
}

.cart-info{
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  width:28px;
  height:28px;
  border-radius:9px;
  background:#fff0f5;
  color:#c9638c;
}

/* =========================
   RECEIPT
========================= */

.receipt{
  border:1px dashed #dfc5d0;
  padding:16px;
  border-radius:15px;
  background:#fffafd;
}

.receipt-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:7px 0;
}

/* =========================
   EMPTY
========================= */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
  color:#aa929d;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:white;
  border-top:1px solid #f0dfe7;
  display:flex;
  justify-content:center;
  gap:50px;
  z-index:60;
}

.bottom-nav button{
  background:none;
  color:#a97c8f;
  font-size:12px;
}

.bottom-nav span{
  display:block;
  font-size:21px;
  margin-bottom:2px;
}

/* =========================
   ORDER ALERT
========================= */

.order-alert{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%) translateY(-120px);
  width:min(420px,90%);
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  z-index:500;
  transition:.3s;
  border:1px solid #f1d8e3;
}

.order-alert.show{
  transform:translateX(-50%) translateY(0);
}

.alert-title{
  color:#d45f8b;
  font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .product-body{
    padding:9px;
  }

  .shop-name{
    font-size:22px;
  }

  .banner{
    height:150px;
  }

  .bottom-nav{
    gap:35px;
  }
}

@media(max-width:380px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .bottom-nav{
    gap:20px;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>
  <div class="header-inner">

    <button class="menu-btn" onclick="openMenu()">☰</button>

    <div class="shop-mini">
      <div class="shop-mini-name" id="miniShopName">♡ My Cute Shop ♡</div>
      <div class="shop-mini-status" id="miniShopStatus"></div>
    </div>

    <button class="cart-btn" onclick="openCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>

<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="banner">
    <img id="bannerImage"
         src="https://placehold.co/1200x350/ffddea/c95f89?text=♡+My+Cute+Shop+♡">
  </div>

  <div class="profile">
    <img id="profileImage"
         class="avatar"
         src="https://placehold.co/200x200/ffe5ef/c95f89?text=♡">

    <h1 class="shop-name" id="shopName">♡ My Cute Shop ♡</h1>

    <div class="shop-status" id="shopStatus"></div>

    <div class="shop-description" id="shopDescription">
      ♡ Thank you for support ♡
    </div>
  </div>

</section>

<!-- SEARCH -->

<div class="search-area">
  <input
    class="search-box"
    id="searchInput"
    placeholder="🔎 ค้นหาสินค้า..."
    oninput="renderProducts()">
</div>

<!-- CATEGORY -->

<div class="category-bar" id="categoryBar"></div>

<!-- PRODUCTS -->

<main class="products" id="productGrid"></main>

<!-- BOTTOM NAV -->

<nav class="bottom-nav">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <span>⌂</span>
    หน้าแรก
  </button>

  <button onclick="openCart()">
    <span>🛒</span>
    ตะกร้า
  </button>

  <button onclick="openMenu()">
    <span>☰</span>
    เมนู
  </button>
</nav>

<!-- MENU OVERLAY -->

<div class="overlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- SIDE MENU -->

<aside class="side-menu" id="sideMenu">

  <div class="menu-title">
    <span>♡ เมนูร้าน ♡</span>
    <button class="close-btn" onclick="closeMenu()">×</button>
  </div>

  <button class="menu-item" onclick="contactAdmin()">
    💌 ติดต่อแอดมิน
  </button>

  <button class="menu-item" onclick="adminLogin()">
    ⚙️ ตั้งค่าเว็บ
  </button>

</aside>

<!-- MODAL ROOT -->

<div id="modalRoot"></div>

<!-- ORDER ALERT -->

<div class="order-alert" id="orderAlert">
  <div class="alert-title">🔔 มีออเดอร์ใหม่!</div>
  <div id="orderAlertText"></div>
</div>

<script>

/* =====================================================
   DEFAULT DATA
===================================================== */

const DEFAULT_SHOP = {
  name:"♡ My Cute Shop ♡",
  description:"♡ Thank you for support ♡",
  isOpen:true,
  profileImage:"https://placehold.co/200x200/ffe5ef/c95f89?text=♡",
  bannerImage:"https://placehold.co/1200x350/ffddea/c95f89?text=♡+My+Cute+Shop+♡",
  dmChannels:[
    {
      id:Date.now(),
      name:"LINE",
      url:"https://line.me/"
    },
    {
      id:Date.now()+1,
      name:"Facebook",
      url:"https://facebook.com/"
    }
  ]
};

const DEFAULT_CATEGORIES = [
  "ทั้งหมด",
  "ของแต่ง",
  "สติ๊กเกอร์",
  "ของสะสม",
  "สินค้าใหม่"
];

const DEFAULT_PRODUCTS = [
  {
    id:1,
    name:"สติ๊กเกอร์หัวใจ",
    price:59,
    category:"สติ๊กเกอร์",
    image:"https://placehold.co/600x600/ffe5ef/c95f89?text=Sticker",
    description:"สติ๊กเกอร์น่ารักสำหรับตกแต่ง",
    promotion:null
  },
  {
    id:2,
    name:"ของแต่งโต๊ะ",
    price:199,
    category:"ของแต่ง",
    image:"https://placehold.co/600x600/e9f7ff/7b9db4?text=Decor",
    description:"ของแต่งโต๊ะสุดน่ารัก",
    promotion:null
  }
];


/* =====================================================
   LOAD DATA
===================================================== */

let shop = JSON.parse(
  localStorage.getItem("shopData") || "null"
) || DEFAULT_SHOP;

let categories = JSON.parse(
  localStorage.getItem("categories") || "null"
) || DEFAULT_CATEGORIES;

let products = JSON.parse(
  localStorage.getItem("products") || "null"
) || DEFAULT_PRODUCTS;

let cart = JSON.parse(
  localStorage.getItem("cartData") || "[]"
);

let orders = JSON.parse(
  localStorage.getItem("orders") || "[]"
);

let selectedCategory = "ทั้งหมด";


function saveAll(){

  localStorage.setItem(
    "shopData",
    JSON.stringify(shop)
  );

  localStorage.setItem(
    "categories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );

  localStorage.setItem(
    "cartData",
    JSON.stringify(cart)
  );

  localStorage.setItem(
    "orders",
    JSON.stringify(orders)
  );
}


/* =====================================================
   SHOP
===================================================== */

function renderShop(){

  document.getElementById("shopName").textContent =
    shop.name;

  document.getElementById("miniShopName").textContent =
    shop.name;

  document.getElementById("shopDescription").textContent =
    shop.description;

  document.getElementById("profileImage").src =
    shop.profileImage;

  document.getElementById("bannerImage").src =
    shop.bannerImage;

  const statusText =
    shop.isOpen
      ? "🟢 ร้านเปิดอยู่"
      : "🔴 ร้านปิดอยู่";

  document.getElementById("shopStatus").textContent =
    statusText;

  document.getElementById("miniShopStatus").textContent =
    statusText;

  document.getElementById("shopStatus").className =
    "shop-status " +
    (shop.isOpen ? "open-text" : "closed-text");

  document.getElementById("miniShopStatus").className =
    "shop-mini-status " +
    (shop.isOpen ? "open-text" : "closed-text");
}


/* =====================================================
   CATEGORY
===================================================== */

function renderCategories(){

  const bar =
    document.getElementById("categoryBar");

  bar.innerHTML = categories.map(cat => `
    <button
      class="category-btn ${cat === selectedCategory ? "active":""}"
      onclick="selectCategory(${JSON.stringify(cat)})">
      ${escapeHtml(cat)}
    </button>
  `).join("");
}


function selectCategory(category){

  selectedCategory = category;

  renderCategories();
  renderProducts();
}


/* =====================================================
   PRODUCT
===================================================== */

function getProductPrice(product){

  const p = product.promotion;

  if(
    p &&
    p.start &&
    p.end
  ){

    const now = new Date();
    const start = new Date(p.start);
    const end = new Date(p.end);

    if(now >= start && now <= end){
      return Number(p.salePrice);
    }
  }

  return Number(product.price);
}


function isPromotionActive(product){

  const p = product.promotion;

  if(!p) return false;

  const now = new Date();

  return (
    p.start &&
    p.end &&
    now >= new Date(p.start) &&
    now <= new Date(p.end)
  );
}


function getProductImage(product){

  if(isPromotionActive(product) &&
     product.promotion.promoImage){

    return product.promotion.promoImage;
  }

  return product.image;
}


function getProductDescription(product){

  if(isPromotionActive(product) &&
     product.promotion.promoDescription){

    return product.promotion.promoDescription;
  }

  return product.description;
}


function renderProducts(){

  const grid =
    document.getElementById("productGrid");

  const keyword =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    products.filter(product => {

      const categoryMatch =
        selectedCategory === "ทั้งหมด" ||
        product.category === selectedCategory;

      const searchMatch =
        product.name.toLowerCase()
          .includes(keyword) ||
        product.description.toLowerCase()
          .includes(keyword);

      return categoryMatch && searchMatch;
    });

  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        🥺 ไม่พบสินค้า
      </div>
    `;

    return;
  }

  grid.innerHTML =
    filtered.map(product => {

      const active =
        isPromotionActive(product);

      const price =
        getProductPrice(product);

      return `
        <article class="product-card">

          <img
            class="product-img"
            src="${escapeAttribute(getProductImage(product))}"
            onclick="showProduct(${product.id})">

          <div class="product-body">

            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>

            <div class="product-description">
              ${escapeHtml(getProductDescription(product))}
            </div>

            <div class="price">

              ${
                active
                ? `<span class="old-price">${formatMoney(product.price)} ฿</span>`
                : ""
              }

              ${formatMoney(price)} ฿

            </div>

            ${
              active
              ? `<span class="sale-badge">🎁 โปรโมชั่น</span>`
              : ""
            }

            <button

/* =====================================================
   CART
===================================================== */

function addToCart(id){

  if(!shop.isOpen){

    alert("ตอนนี้ร้านปิดอยู่ค่ะ ♡");
    return;
  }

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const existing =
    cart.find(item => item.id === id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }

  saveAll();
  renderCartCount();
}


function changeQty(id, amount){

  const item =
    cart.find(x => x.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    cart =
      cart.filter(x => x.id !== id);

  }

  saveAll();

  renderCartCount();
  renderCartModal();
}


function removeCart(id){

  cart =
    cart.filter(x => x.id !== id);

  saveAll();

  renderCartCount();
  renderCartModal();
}


function renderCartCount(){

  const count =
    cart.reduce((sum,item) =>
      sum + item.qty,0);

  document.getElementById("cartCount")
    .textContent = count;
}


function cartTotal(){

  return cart.reduce((sum,item) => {

    const product =
      products.find(p => p.id === item.id);

    if(!product) return sum;

    return sum +
      getProductPrice(product) * item.qty;

  },0);
}


function openCart(){

  renderCartModal();
}


function renderCartModal(){

  const html =
    cart.length
    ? `
      ${cart.map(item => {

        const p =
          products.find(x => x.id === item.id);

        if(!p) return "";

        return `
          <div class="cart-item">

            <img src="${escapeAttribute(getProductImage(p))}">

            <div class="cart-info">

              <strong>
                ${escapeHtml(p.name)}
              </strong>

              <div>
                ${formatMoney(getProductPrice(p))} ฿
              </div>

              <div class="qty">

                <button onclick="changeQty(${p.id},-1)">
                  −
                </button>

                <span>${item.qty}</span>

                <button onclick="changeQty(${p.id},1)">
                  +
                </button>

                <button
                  class="danger"
                  onclick="removeCart(${p.id})">
                  ลบ
                </button>

              </div>

            </div>

          </div>
        `;

      }).join("")}

      <hr>

      <div style="display:flex;justify-content:space-between;font-weight:800">
        <span>รวม</span>
        <span>${formatMoney(cartTotal())} ฿</span>
      </div>

      <button

        style="width:100%;margin-top:15px"
        onclick="checkout()">

    `
    : `

        🛒 ยังไม่มีสินค้าในตะกร้า
      </div>
    `;

  showModal("🛒 ตะกร้าสินค้า",html);
}

/* =====================================================
   FINISH ORDER
===================================================== */

function finishOrder(orderNumber,customerName,contact){

  const file =
    document.getElementById("slipFile").files[0];

  const createOrder = slipImage => {

    const items =
      cart.map(item => {

        const p =
          products.find(x => x.id === item.id);

        return {
          id:p.id,
          name:p.name,
          qty:item.qty,
          price:getProductPrice(p)
        };

      });

    const total =
      items.reduce(
        (sum,item) =>
          sum + item.price * item.qty,
        0
      );

    const order = {

      id:orderNumber,

      createdAt:new Date().toISOString(),

      customerName,

      contact,

      items,

      total,

      slip:slipImage || "",

      viewed:false

    };

    orders.unshift(order);

    cart = [];

    saveAll();

    renderCartCount();

    closeModal();

    showReceipt(order);

    triggerAdminOrderAlert(order);
  };

  if(file){

    const reader =
      new FileReader();

    reader.onload = () =>
      createOrder(reader.result);

    reader.readAsDataURL(file);

  }else{

    createOrder("");

  }
}

    `

    `
  );
}


function saveRenamedCategory(oldName){

  const newName =
    document.getElementById(
      "renameCategoryInput"
    ).value.trim();

  if(!newName) return;

  if(
    categories.includes(newName) &&
    newName !== oldName
  ){

    alert("มีหมวดหมู่นี้อยู่แล้ว");
    return;
  }

  const index =
    categories.indexOf(oldName);

  if(index !== -1)
    categories[index] = newName;

  products.forEach(product => {

    if(product.category === oldName)
      product.category = newName;

  });

  if(selectedCategory === oldName)
    selectedCategory = newName;

  saveAll();

  closeModal();

  renderCategories();
  renderProducts();

  openAdminSettings();
}


function deleteCategory(name){

  if(!confirm(
    `ลบหมวดหมู่ "${name}" ใช่หรือไม่?`
  )) return;

  categories =
    categories.filter(x => x !== name);

  products.forEach(product => {

    if(product.category === name)
      product.category = "ทั้งหมด";

  });

  if(selectedCategory === name)
    selectedCategory = "ทั้งหมด";

  saveAll();

  renderCategories();
  renderProducts();

  openAdminSettings();
}

/* =====================================================
   IMAGE READER
===================================================== */

function fileToDataURL(file){

  return new Promise(resolve => {

    if(!file){

      resolve("");

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.readAsDataURL(file);

  });
}


/* =====================================================
   SAVE NEW PRODUCT
===================================================== */

async function saveNewProduct(){

  const name =
    document.getElementById("productName")
      .value.trim();

  const price =
    Number(
      document.getElementById("productPrice").value
    );

  const category =
    document.getElementById("productCategory").value;

  const description =
    document.getElementById("productDescription")
      .value.trim();

  if(!name || !price){

    alert("กรุณากรอกชื่อและราคา");
    return;
  }

  const imageFile =
    document.getElementById("productImageFile").files[0];

  const promoImageFile =
    document.getElementById("promoImageFile").files[0];

  const image =
    await fileToDataURL(imageFile);

  const promoImage =
    await fileToDataURL(promoImageFile);

  const promoPrice =
    Number(
      document.getElementById("promoPrice").value
    );

  const promoStart =
    document.getElementById("promoStart").value;

  const promoEnd =
    document.getElementById("promoEnd").value;

  const promoDescription =
    document.getElementById("promoDescription")
      .value.trim();

  const product = {

    id:Date.now(),

    name,

    price,

    category,

    image:
      image ||
      "https://placehold.co/600x600/ffe5ef/c95f89?text=Product",

    description,

    promotion:
      promoPrice && promoStart && promoEnd
      ? {
          salePrice:promoPrice,
          start:new Date(promoStart).toISOString(),
          end:new Date(promoEnd).toISOString(),
          promoImage,
          promoDescription
        }
      : null
  };

  products.unshift(product);

  saveAll();

  closeModal();

  renderProducts();

  openAdminSettings();
}

function editProduct(id){

async function updateProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  product.name =
    document.getElementById("productName")
      .value.trim();

  product.price =
    Number(
      document.getElementById("productPrice").value
    );

  product.category =
    document.getElementById("productCategory").value;

  product.description =
    document.getElementById("productDescription")
      .value.trim();

  const imageFile =
    document.getElementById("productImageFile").files[0];

  const promoImageFile =
    document.getElementById("promoImageFile").files[0];

  if(imageFile){

    product.image =
      await fileToDataURL(imageFile);

  }

  const promoPrice =
    Number(
      document.getElementById("promoPrice").value
    );

  const promoStart =
    document.getElementById("promoStart").value;

  const promoEnd =
    document.getElementById("promoEnd").value;

  const promoDescription =
    document.getElementById("promoDescription")
      .value.trim();

  let promoImage =
    product.promotion?.promoImage || "";

  if(promoImageFile){

    promoImage =
      await fileToDataURL(promoImageFile);

  }

  if(
    promoPrice &&
    promoStart &&
    promoEnd
  ){

    product.promotion = {

      salePrice:promoPrice,

      start:new Date(promoStart).toISOString(),

      end:new Date(promoEnd).toISOString(),

      promoImage,

      promoDescription

    };

  }else{

    product.promotion = null;

  }

  saveAll();

  closeModal();

  renderProducts();

  openAdminSettings();
}


function deleteProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  if(!confirm(
    `ต้องการลบ "${product.name}" หรือไม่?`

  products =
    products.filter(p => p.id !== id);

  cart =
    cart.filter(item => item.id !== id);

  renderCartCount();

}

          ${content}

        </div>

      </div>

    </div>

  `;

}


function closeModalByBackground(event){

  if(event.target.id === "activeModal"){
    closeModal();
  }
}


function closeModal(){

  document.getElementById("modalRoot")
    .innerHTML = "";
}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

function previewImage(input,targetId){

  const file =
    input.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload =
    e => {

      document.getElementById(targetId)
        .src = e.target.result;

    };

  reader.readAsDataURL(file);
}


/* =====================================================
   HELPERS
===================================================== */

function formatMoney(number){

  return Number(number || 0)
    .toLocaleString("th-TH",{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    });
}


function formatDate(date){

  return new Date(date)
    .toLocaleString("th-TH",{
      dateStyle:"short",
      timeStyle:"short"
    });
}


function toDateInput(date){

  if(!date) return "";

  const d =
    new Date(date);

  const pad =
    n => String(n).padStart(2,"0");

  return (
    d.getFullYear() +
    "-" +
    pad(d.getMonth()+1) +
    "-" +
    pad(d.getDate()) +
    "T" +
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes())
  );
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

  return escapeHtml(value)
    .replace(/`/g,"&#096;");
}
